<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDS 显示端原型 V2.1（输码态 / 待机主题 / 内容态）</title>
<style>
:root{
  --cds-bg:#000; --cds-fg:#e8ecf2; --cds-fg-muted:#a9b3c2; --cds-accent:#8ab4f8;
  --cds-font-ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --cds-font-body:"Songti SC","Noto Serif SC",serif;
  --cds-font-scale:1.15; --cds-font-size:72px; --cds-line-height:1.75; --cds-align:left;
}
*{box-sizing:border-box}
html{font-size:18px}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--cds-bg);color:var(--cds-fg);font-family:var(--cds-font-ui)}
.stage{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:absolute;inset:0;transition:opacity .18s ease}
.view[hidden],#entry[hidden]{display:none}

/* ── 输码态 ── */
#entry{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vh 6vw}
.entry-inner{width:min(560px,86vw)}
.entry-inner h1{font-size:1.6rem;margin:0 0 .4rem;font-weight:600;letter-spacing:.05em}
.entry-inner p{color:var(--cds-fg-muted);margin:0 0 2.2rem;font-size:.9rem;line-height:1.7}
.digits{display:flex;gap:12px;justify-content:center;margin-bottom:1.4rem}
.digits input{width:min(72px,13vw);height:min(96px,18vw);text-align:center;font:600 min(2.6rem,7vw)/1 ui-monospace,monospace;
  color:var(--cds-fg);background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.18);border-radius:12px;outline:none}
.digits input:focus{border-color:var(--cds-accent);background:rgba(255,255,255,.09)}
.entry-inner button.go{font:600 1.05rem/1 var(--cds-font-ui);padding:1rem 3.2rem;border-radius:999px;border:none;
  background:var(--cds-accent);color:#06101f;cursor:pointer;min-height:52px}
.entry-inner button.go:active{transform:translateY(1px)}
.err{color:#ff9d9d;font-size:.85rem;min-height:1.4rem;margin-top:1rem}
.code-meta{font-size:.78rem;color:var(--cds-fg-muted);letter-spacing:.04em;margin:-1.2rem 0 1.4rem;min-height:1.2rem}
.code-meta.warn{color:#ffcf8a}
.code-meta.bad{color:#ff9d9d}
.entry-banner{position:absolute;top:0;left:0;right:0;padding:.85rem 1rem;background:#3a1414;color:#ffd7d7;font-size:.85rem;text-align:center}
.entry-banner[hidden]{display:none}
.reset-hint{position:absolute;right:18px;bottom:14px;font-size:12px;color:rgba(255,255,255,.28);user-select:none;cursor:default}
.ring{position:absolute;right:12px;bottom:8px;width:40px;height:40px;opacity:0;transition:opacity .1s}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke:rgba(255,255,255,.45);stroke-width:3;stroke-dasharray:100.5;stroke-dashoffset:100.5}

/* ── 内容态 ── */
#content{padding:5vh 5vw}
.music{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* V2.1.5：去掉音轨封面。Jeremyzh：显示端只留顶部歌名 + 歌词；音轨徽标属功能，留在控制台。 */
.music .t{font-size:1.5rem;font-weight:600;letter-spacing:.04em}
.music .sub{color:var(--cds-fg-muted);font-size:.8rem;margin-top:.5rem}
/* V2.1.5：歌词跟同一字号变量（--cds-font-size）走；字号可到 120px，当前行必须居中滚动，
   否则「当前句」会滚出 21vh 的可视区——那等于改了字号看不见歌词 */
.lyrics{margin-top:3vh;flex:1;min-height:0;overflow:hidden;width:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center}
.lyric{font-size:calc(var(--cds-font-size) * .78);line-height:1.5;color:rgba(255,255,255,.3);padding:.05em 0}
.lyric.cur{color:var(--cds-accent)}
.progress{position:absolute;left:5vw;right:5vw;bottom:4vh;height:4px;background:rgba(255,255,255,.14);border-radius:99px}
.progress i{display:block;height:100%;background:var(--cds-accent);border-radius:99px;transition:width .25s linear}

.article{height:100%;display:flex;flex-direction:column}
.article .foot{display:flex;justify-content:flex-end;font-size:.68rem;opacity:.5;min-height:1.4em}
.article .head{color:var(--cds-fg-muted);font-size:.8rem;letter-spacing:.06em;margin-bottom:2.5vh}
.article .head b{color:var(--cds-fg);font-size:1rem;margin-right:.8rem}
.body{flex:1;overflow:hidden;position:relative;font-family:var(--cds-font-body);
  font-size:var(--cds-font-size);line-height:var(--cds-line-height);text-align:var(--cds-align)}
/* V2.1.6：整章常驻，只移动视口起点（不切片文本，段距只存在于一处 CSS） */
.body .flow{position:absolute;left:0;right:0;top:0;will-change:transform}
.body p{margin:0 0 1.1em;transition:font-size .2s ease,color .2s ease}
.body .sn{color:var(--cds-fg-muted);font-size:.6em;vertical-align:.25em;margin-right:.5em;font-family:var(--cds-font-ui);line-height:1}
/* V2.1.10：每行一个 nowrap 块——行数由切行数组决定，不靠浏览器自然折行（混排宽度不可算） */
.body p .ln{display:block;white-space:nowrap;overflow:hidden}

.cast{height:100%;display:flex;align-items:center;justify-content:center}
/* V2.1.6：板书用同一 fontSizePx（删掉 min(…, 6.5vh)：6.5vh 在 1080p＝70.2px，72px 以上全无效）；
   装不下时由 fitCast() 按步长 4 降档，并把实际生效值回报控制页——不静默缩 */
.cast .paper{max-width:74vw;max-height:100%;overflow:hidden;font-family:var(--cds-font-body);
  font-size:var(--cds-font-size);
  line-height:var(--cds-line-height);text-align:var(--cds-align);white-space:pre-wrap}

.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cds-fg-muted)}
.idle .room{font-size:1.35rem;color:var(--cds-fg);letter-spacing:.12em}
.idle .clock{font:300 4.2rem/1.2 ui-monospace,monospace;margin:2vh 0 1vh;color:rgba(255,255,255,.85)}
.idle .wait{font-size:.8rem;letter-spacing:.14em;color:rgba(255,255,255,.35)}

/* ── 系统层 ── */
#sys{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem;background:rgba(20,22,28,.92);
  border-top:1px solid rgba(255,255,255,.12);font-size:.8rem;color:#ffd9a0;display:none;z-index:50}
#sys.show{display:block}
#sys.bad{background:rgba(58,20,20,.94);color:#ffd7d7}
#dbg{position:fixed;right:10px;top:10px;font:11px/1.5 ui-monospace,monospace;color:rgba(255,255,255,.4);text-align:right;display:none}
#dbg.show{display:block}
</style>
</head>
<body>
<div class="stage">

  <!-- 输码态 -->
  <section class="view" id="entry">
    <div class="entry-banner" id="banner" hidden>控制码已失效，请重新输入</div>
    <div class="entry-inner">
      <h1>教室显示</h1>
      <p>请输入控制台上的控制码<br>（首次使用一次，之后开机自动连上）</p>
      <div class="code-meta" id="codeMeta"></div>
      <div class="digits" id="digits">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
      </div>
      <button class="go" id="go">确认</button>
      <div class="err" id="err"></div>
    </div>
    <span class="reset-hint" id="resetHint">长按 3 秒重置</span>
    <div class="ring" id="ring"><svg width="40" height="40"><circle cx="20" cy="20" r="16"/></svg></div>
  </section>

  <!-- 内容态（零控件） -->
  <section class="view" id="content" hidden></section>

  <div id="sys"></div>
  <div id="dbg"></div>
</div>

<script>
(function(){
  'use strict';
  var LS = window.localStorage, BC = ('BroadcastChannel' in window) ? new BroadcastChannel('cds-proto') : null;
  var $ = function(id){ return document.getElementById(id); };
  var DEBUG = /[?&]debug=1/.test(location.search);
  var sysTimer = null;                    // V2.1：显示端无音频（无音频上下文、无解锁状态）

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(ms){ var s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

  // ── 系统层 ──
  function sys(text, bad, ms){
    var el=$('sys'); el.textContent=text; el.className='show'+(bad?' bad':'');
    clearTimeout(sysTimer);
    if(ms) sysTimer=setTimeout(function(){ el.className=''; }, ms);
  }
  function sysOff(){ $('sys').className=''; }

  // ── 样式（本地缓存优先，避免闪字） ──
  // V2.1.11：每行字数默认 auto（按屏宽 ÷ 字号派生）；手动档只在老师拖过滑块后生效
  var STYLE_CPL='auto';
  var STYLE_FPX='auto';            // 'auto' = 按视口高派生；数字 = 控制台显式指定（换屏不重算）
  var WARN_SCALE=false;
  // V2.2.15：把派生抽出来，供「启动」与「换屏」共用。产品 V2.1.12 已修「启动时不派生」，
  // 但派生值在窗口化↔全屏换屏时不会重算（旧码只在 applyStyle 里算一次）。
  function deriveFpx(){
    var _h=window.innerHeight||1080;
    return Math.max(24, Math.min(160, Math.round(_h*0.067/4)*4));   // 720p 48 / 1080p 72 / 1440p 96 / 2160p 144
  }
  function applyFpx(){
    var f=(STYLE_FPX==='auto')?deriveFpx():STYLE_FPX;
    f=Math.max(24, Math.min(160, f));
    document.documentElement.style.setProperty('--cds-font-size', f+'px');
    return f;
  }
  function applyStyle(st){
    st = st || {};                 // V2.2.15：null 也当空样式处理，绝不停在 CSS 默认 72px
    var r=document.documentElement.style;
    if(st.fontFamily && st.fontFamily.body){
      var map={song:'"Songti SC","Noto Serif SC",serif',hei:'"PingFang SC","Microsoft YaHei",sans-serif',kai:'"Kaiti SC",KaiTi,serif','system-ui':'system-ui,sans-serif'};
      r.setProperty('--cds-font-body', map[st.fontFamily.body]||st.fontStack||'system-ui,sans-serif');
    }
    // V2.2.13：fontScale **作废**——收到忽略并在 ack.note 里 warn。
    // 旧实现按 ×18 折算 px，fontScale:1.0 会得 18px（字直接小到墙脚），已删。
    if(st.fontScale!=null) WARN_SCALE=true;
    // V2.2.15：显式值锁进 STYLE_FPX（换屏/缩放不重算）；缺省或 'auto' ⇒ 每次按视口高派生
    var _f=+st.fontSizePx;
    STYLE_FPX=(st.fontSizePx!=null && st.fontSizePx!=='auto' && isFinite(_f)) ? Math.max(24, Math.min(160, _f)) : 'auto';
    applyFpx();
    if(st.lineHeight) r.setProperty('--cds-line-height', st.lineHeight);
    if(st.fg){ r.setProperty('--cds-fg', st.fg); }
    if(st.bg){ r.setProperty('--cds-bg', st.bg); }
    if(st.align) r.setProperty('--cds-align', st.align);
    if(st.charsPerLine==='auto') STYLE_CPL='auto';
    else if(st.charsPerLine!=null && st.charsPerLine!=='') STYLE_CPL=Math.max(6, Math.min(40, +st.charsPerLine||12));
  }
  // mqtt §4.6：effective 回带生效值，只走独立消息，不进 pageMap（pageMap 恒 7 字段）
  function sendStyleApplied(note){
    if(!BC) return;
    var r=getComputedStyle(document.documentElement);
    var epx=parseFloat(r.getPropertyValue('--cds-font-size'))||72;
    var elh=parseFloat(r.getPropertyValue('--cds-line-height'))||1.75;
    // V2.1.11：auto 回**派生出的整数**，否则控制台看到的是字符串 "auto"
    var _b=document.querySelector('#content .article .body');
    BC.postMessage({kind:'styleApplied',
      effective:{fontSizePx:epx, lineHeight:elh, charsPerLine:cplNow(_b)}, note:note||''});
  }
  // V2.1.12：**无缓存样式时也要走派生**（字号 = round4(屏高×6.7%)、每行字数 = auto）。
  // 原写法 applyStyle(null) 在里面直接 return，未收过 display.style 的显示端会停在 CSS 的 72px——
  // 在 4K 上等于只画到半屏宽（W=3456，72px×24=1728），与 §7.5.3「默认＝派生」不一致。
  var _st=null; try{ _st=JSON.parse(LS.getItem('cds.style')||'null'); }catch(e){}
  applyStyle(_st||{});

  // ── 心跳（供控制台算"在线终端数"） ──
  function beat(){ if(LS.getItem('cds.bound')) LS.setItem('cds.displayBeat', String(Date.now())); }
  setInterval(beat, 1000);

  // ── 数据 ──
  var S = { scene:'standby', standby:{ mode:'theme' }, music:{ idx:0, playing:false, pos:0, anchor:null, items:[
      { t:'我心灵得安宁', m:'4:05', dur:245000 },{ t:'奇异恩典', m:'3:42', dur:222000 },{ t:'靠近主', m:'5:10', dur:310000 }]},
    article:{ idx:0, page:0, pageCount:0, cast:false, items:[{t:'诗篇 23 章',v:'诗篇',ch:23},{t:'约伯记 3 章',v:'约伯记',ch:3}]},
    cast:{ active:false, text:'', castId:'' }
  };
  try{
    var saved=JSON.parse(LS.getItem('cds.consoleState')||'null');
    if(saved){ S.music.items=saved.music; S.article.items=saved.article; }
  }catch(e){}

  var LYRICS = ['宇宙广阔无垠','我心灵得安宁','如海洋般深沉','主恩典够我用','我安然躺卧'];
  var VERSES = {
    23:[['1','耶和华是我的牧者，我必不致缺乏。'],['2','他使我躺卧在青草地上，领我在可安歇的水边。'],['3','他使我的灵魂苏醒，为自己的名引导我走义路。'],['4','我虽然行过死荫的幽谷，也不怕遭害，因为你与我同在。'],['5','在我敌人面前，你为我摆设筵席；你用油膏了我的头，使我的福杯满溢。'],['6','我一生一世必有恩惠慈爱随着我，我且要住在耶和华的殿中，直到永远。']],
    3:[['1','此后，约伯开口咒诅自己的生日。'],['2','说：愿我生的那日和说怀了男胎的那夜都灭没。'],['3','愿那日变为黑暗；愿神不从上面寻找它。']]
  };

  // ── 分页 / 步进：整章行流 + 真实几何（V2.1.6）
  // 不再维护平行 ruler：getBoundingClientRect() 不含 margin，段距会整体丢失——
  // V2.1.5 在默认 72px 下就裁行（3 个两行节测得 756≤911 通过、实渲染 993.6 → overflow:hidden 静默裁掉最后一行）
  var A={ready:false, unit:'page', pageIndex:0, sectionIndex:0,
         totalLines:1, viewLines:1, pageCount:1, sectionCount:0, verseLineIndex:[], lineY:[], pageStarts:[0], lh:126};

  function artBody(){ return document.querySelector('#content .article .body'); }

  // ── V2.1.10：算术分页（主路径）。行数＝切行数组长度，不靠自然折行 ──
  function charW(ch){ return ch.charCodeAt(0) < 128 ? 0.5 : 1; }   // 全角 1／半角 0.5
  function sliceLines(text, c){
    var out=[], cur='', acc=0;
    for(var i=0;i<text.length;i++){
      var w=charW(text.charAt(i));
      if(cur && acc+w > c+1e-9){ out.push(cur); cur=''; acc=0; }
      cur+=text.charAt(i); acc+=w;
    }
    out.push(cur);
    return out;
  }
  // 有效上限 = min(24 可读性底线, floor(W÷F) 物理上限)。24 不是技术限制（24px 字号下 floor 可达 72），
  // 是一行超过 24 个全角字后排跟行会跳字——不得以「装得下」为理由放开。
  function cplMax(W){
    var F=parseFloat(document.documentElement.style.getPropertyValue('--cds-font-size'))||72;
    return Math.max(6, Math.min(24, Math.floor((W||1728)/F)));
  }
  function usableW(body){
    // V2.1.12：可用宽＝正文块的内容宽。**不能拿 #content.clientWidth**——它含 5vw 左右 padding，
    // 在 1280 屏会读到 1280（真可用 1152），每行多排 2 字并把行尾裁掉（overflow:hidden 下是静默的）。
    if(body && body.clientWidth){
      var cs=getComputedStyle(body);
      return body.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0);
    }
    // 渲染期 .body 尚未插入：正文块恒为视口宽的 90%（#content 的 5vw×2）
    return Math.max(240, (window.innerWidth||1280) * 0.9);
  }
  function cplNow(body){
    var W=usableW(body), cap=cplMax(W);
    if(STYLE_CPL==='auto') return cap;
    var c=parseInt(STYLE_CPL,10); if(!c) return cap;
    return Math.max(6, Math.min(cap, c));
  }

  function layoutArticle(silent){
    var body=artBody(); if(!body) return;
    var flow=body.querySelector('.flow'); if(!flow) return;
    flow.style.transform='none';
    var cs=getComputedStyle(body);
    var F=parseFloat(cs.fontSize)||72;
    var lh=parseFloat(cs.lineHeight)||(F*1.75);
    var gap=1.1*F;                        // 段距恒 1.1em；lineHeight 只改行高
    var H=body.clientHeight; if(H<40) return;
    var els=[].slice.call(flow.children);
    A.L=els.map(function(el){ return Math.max(1, parseInt(el.getAttribute('data-lines'),10)||1); });
    A.lineY=[]; A.verseLineIndex=[];
    var y=0, total=0;
    A.L.forEach(function(n){
      A.verseLineIndex.push(A.lineY.length);
      for(var i=0;i<n;i++) A.lineY.push(y+i*lh);
      y += n*lh + gap;
      total += n;
    });
    A.totalLines=total; A.lh=lh; A.gap=gap; A.sectionCount=A.L.length;
    buildPageStarts(H, lh, gap);
    A.ready=true;
    verifyModel(flow);                    // DOM 只校验，不覆盖
    applyView(silent);
    postMetrics();                        // 实测 W/H/生效三值 → 控制台的「每行上限」按这个算
  }

  // 装页：整节下移（唯一规则）；某节自身超一屏才在节内切（页脚标「续」）
  function buildPageStarts(H, lh, gap){
    var ps=[0], used=0, secsOnPage=0, k=0, off=0, done=0;
    while(k<A.L.length){
      var remaining=A.L[k]-off;
      if(remaining<=0){ k++; off=0; continue; }
      var need=remaining*lh + ((secsOnPage>0 && off===0) ? gap : 0);
      if(used+need<=H+0.5){
        used+=need; done+=remaining; secsOnPage++; k++; off=0;
      } else if(secsOnPage===0){
        var per=Math.max(1, Math.floor((H+0.5)/lh));
        if(per>remaining) per=remaining;
        used+=per*lh; done+=per; off+=per;
        ps.push(done); used=0; secsOnPage=0;
      } else {
        ps.push(done); used=0; secsOnPage=0;
      }
    }
    A.pageStarts=ps;
    A.pageCount=ps.length;
    A.viewLines=(ps.length>1 ? ps[1] : A.totalLines) - ps[0];
    if(A.viewLines<1) A.viewLines=1;
  }

  // 校验：算术 vs 真实几何，误差 >1px 告警（mqtt.md §4.6.2：模型错＝bug，不得静默覆盖）
  function verifyModel(flow){
    var bad=0, worst=0;
    [].slice.call(flow.children).forEach(function(el,k){
      var exp=A.L[k]*A.lh, act=el.getBoundingClientRect().height;
      var d=Math.abs(exp-act); if(d>worst) worst=d;
      if(d>1) bad++;
    });
    A.modelWarn=bad?worst:0;
    if(bad && window.console) console.warn('[cds] 排版模型偏差 '+worst.toFixed(1)+'px（'+bad+' 节），按算术后继续');
  }

  function sectionOfLine(line){
    var k=0;
    for(var i=0;i<A.verseLineIndex.length;i++){ if(A.verseLineIndex[i]<=line) k=i; }
    return k;
  }

  function pageOfLine(line){
    var p=0;
    for(var i=0;i<A.pageStarts.length;i++){ if(A.pageStarts[i]<=line) p=i; }
    return p;
  }

  function applyView(silent){
    var body=artBody(); if(!body||!A.ready) return;
    var flow=body.querySelector('.flow'); if(!flow) return;
    var startLine;
    if(A.unit==='section'){
      A.sectionIndex=Math.max(0,Math.min(A.sectionCount-1,A.sectionIndex));
      startLine=A.verseLineIndex[A.sectionIndex]||0;
      A.pageIndex=pageOfLine(startLine);      // pageCount 恒为整章屏数，与 unit 无关
    } else {
      A.pageIndex=Math.max(0,Math.min(A.pageCount-1,A.pageIndex));
      startLine=A.pageStarts[A.pageIndex];
      A.sectionIndex=sectionOfLine(startLine);
    }
    flow.style.transform='translateY(-'+(A.lineY[startLine]||0).toFixed(1)+'px)';
    var foot=document.querySelector('#content .article .foot');
    if(foot){
      if(A.unit==='page'){
        var nxt=A.pageStarts[A.pageIndex+1];
        var contTop=(A.pageIndex>0 && A.verseLineIndex.indexOf(startLine)<0);
        var cut=(nxt!=null && A.verseLineIndex.indexOf(nxt)<0);
        foot.textContent=(contTop?'（续上） ':'')+(cut?'（续）':'');
      } else {
        foot.textContent='节 '+(A.sectionIndex+1)+' / '+A.sectionCount;   // section 模式没有屏概念，也永不标「续」
      }
    }
    var seg=document.querySelector('#content .article .head .seg');
    if(seg) seg.textContent = A.unit==='section'
      ? ('第 '+(A.sectionIndex+1)+' / '+A.sectionCount+' 节')
      : ('第 '+(A.pageIndex+1)+' / '+A.pageCount+' 屏 · 全篇 '+A.totalLines+' 行');
    if(!silent) postPageMap();
  }

  // mqtt §4.4：`anchor`＝视口起点所在经节与节内字符偏移。行号只在本机内部用，不上行。
  function anchorAt(line){
    var k=sectionOfLine(line), vs=A.verses||[];
    var li=Math.max(0, line-(A.verseLineIndex[k]||0));
    var txt=(vs[k]&&vs[k][1])||'', cpl=cplNow(artBody())||12;
    var off=0, acc=0, n=0;
    while(off<txt.length && n<li){
      var w=charW(txt.charAt(off));
      if(acc+w>cpl+1e-9){ n++; acc=0; continue; }
      acc+=w; off++;
    }
    return {verseSn:(vs[k]?+vs[k][0]:(k+1)), charOffset:off};
  }
  function postPageMap(){
    if(!BC || !A.ready) return;
    var startLine=(A.unit==='section') ? (A.verseLineIndex[A.sectionIndex]||0) : (A.pageStarts[A.pageIndex]||0);
    BC.postMessage({kind:'pageMap', anchor:anchorAt(startLine), unit:A.unit,
      pageIndex:A.pageIndex, pageCount:A.pageCount, sectionIndex:A.sectionIndex,
      sectionCount:A.sectionCount, viewLines:A.viewLines});   // 恒 7 字段：totalLines / charsPerLine 都不上行
  }
  // 显示端实测几何（＝协议 state.report.layout，原型内用 BroadcastChannel 走同名消息）：
  // 控制台的「每行上限」必须按这个算（availW 与 fontSizePx 同一帧），
  // 否则 1280 屏可用宽 1152（真上限 18）会按 1728 算出 24，锁了 24 被显示端静默收紧回 18。
  var _mt=null;
  function postMetrics(){
    if(!BC || !A.ready) return;
    clearTimeout(_mt);
    _mt=setTimeout(function(){
      var b=artBody(); if(!b||!BC) return;
      var cs=getComputedStyle(b);
      BC.postMessage({kind:'layoutMetrics', availW:usableW(b), availH:b.clientHeight,
        fontSizePx:parseFloat(cs.fontSize)||72, lineHeight:parseFloat(cs.lineHeight)||0,
        charsPerLine:cplNow(b)});
    }, 120);
  }

  // mqtt §4.6：W/H 或三参任一变化 ⇒ 重测 → 重算 → **重发 pageMap**（auto 下 pageCount 随屏变）
  function relayoutArticle(){ if(S.scene!=='article'||!A.ready) return; layoutArticle(); }
  (function watchGeometry(){
    function kick(){ clearTimeout(window._rz); window._rz=setTimeout(function(){
      if(STYLE_FPX==='auto') applyFpx();     // 窗口化<->全屏换屏：派生字号必须跟着视口高走
      relayoutArticle();
    },200); }
    if(window.ResizeObserver){
      var ro=new ResizeObserver(kick);
      var host=document.getElementById('content'); if(host) ro.observe(host);
    }
    window.addEventListener('resize', kick);              // 兜底：老浏览器 / 旋屏
    window.addEventListener('orientationchange', kick);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(relayoutArticle);  // 字体落地后行宽会变
  })();

  function stepArticle(dir, steps){
    if(!A.ready) return;
    var st=Math.max(1,steps||1);
    if(A.unit==='section'){
      var ni=A.sectionIndex+(dir==='prev'?-st:st);
      A.sectionIndex=Math.max(0,Math.min(A.sectionCount-1,ni));
      if(ni!==A.sectionIndex) sys('已到章末', false, 1600);
    } else {
      var np=A.pageIndex+(dir==='prev'?-st:st);
      A.pageIndex=Math.max(0,Math.min(A.pageCount-1,np));
      if(np!==A.pageIndex) sys('已到章末', false, 1600);
    }
    var line=(A.unit==='section')?(A.verseLineIndex[A.sectionIndex]||0):A.pageStarts[A.pageIndex];
    if(A.unit==='section') A.pageIndex=pageOfLine(line); else A.sectionIndex=sectionOfLine(line);
    applyView();
  }

  function setUnit(u){
    var startLine=(A.unit==='section')?(A.verseLineIndex[A.sectionIndex]||0):A.pageStarts[A.pageIndex];
    A.unit=(u==='section')?'section':'page';
    if(A.unit==='section') A.sectionIndex=sectionOfLine(startLine);
    else A.pageIndex=pageOfLine(startLine);
    applyView();                      // 切 unit 不重发 pageMap：pageCount / sectionCount 恒报、不跳数
  }

  // 「整章一屏」＝逐级降档到 pageCount==1。顺序（Jeremyzh 12:43）：
  //   ① 先降行距 1.75→1.2（步长 0.05，最省字号）→ ② 再把每行字数抬到当前上限 →
  //   ③ 最后才降字号（步长 4、下限 24）。
  // 三档都试完仍多屏 ⇒ 全部回滚并如实报「到最小仍 N 屏」，不留半套样式。
  function fitOnePage(){
    var root=document.documentElement.style;
    var F0=parseFloat(root.getPropertyValue('--cds-font-size'))||72;
    var LH0=parseFloat(root.getPropertyValue('--cds-line-height'))||1.75;
    var CP0=STYLE_CPL, FPX0=STYLE_FPX, changed=[], done=false;
    layoutArticle(true);
    if(A.pageCount<=1){ postPageMap(); sendStyleApplied('整章一屏：已是一屏，未动样式'); return; }
    function fits(){ layoutArticle(true); return A.pageCount<=1; }
    // ① 行距
    var lh=+LH0.toFixed(2);
    while(!done && lh>1.2+1e-9){
      lh=+Math.max(1.2, lh-0.05).toFixed(2);
      root.setProperty('--cds-line-height', lh);
      if(fits()){ changed.push('行距 '+LH0.toFixed(2)+'→'+lh.toFixed(2)); done=true; }
    }
    // ② 每行字数（auto 本就在上限，只有老师锁低了才有作用）
    if(!done){
      var b=artBody(), cap=cplMax(b?b.clientWidth:1728);
      if(cplNow(b)<cap){ STYLE_CPL=cap; if(fits()){ changed.push('每行 '+CP0+'→'+cap+' 字'); done=true; } }
    }
    // ③ 字号
    var px=F0;
    while(!done && px>24){
      px=Math.max(24, px-4);
      STYLE_FPX=px; root.setProperty('--cds-font-size', px+'px');
      if(fits()){ changed.push('字号 '+F0+'→'+px+'px'); done=true; }
    }
    if(!done){                                              // 回滚：宁可不动，也不留半套
      root.setProperty('--cds-line-height', LH0);
      STYLE_CPL=CP0; STYLE_FPX=FPX0; applyFpx();
      layoutArticle(true);
      postPageMap(); sendStyleApplied('整章一屏：已到最小（行距 1.2 / 字号 24）仍 '+A.pageCount+' 屏，未改样式');
      sys('整章一屏：已到最小仍 '+A.pageCount+' 屏，样式已还原', false, 3600);
      return;
    }
    // V2.2.15：note 必须写全「与点击前不同」的每一档——②抬高 cpl 但靠③才成一屏时 cpl 也变了，
    // 只报字号会让老师看到「每行 N 字」变了而 note 没提（effective 带真值，note 漏报同样算口径不一致）
    var FX=parseFloat(root.getPropertyValue('--cds-font-size'))||F0;
    var LHX=parseFloat(root.getPropertyValue('--cds-line-height'))||LH0;
    var parts=[];
    if(Math.abs(LHX-LH0)>1e-9) parts.push('行距 '+LH0.toFixed(2)+'→'+LHX.toFixed(2));
    if(String(STYLE_CPL)!==String(CP0)) parts.push('每行 '+CP0+'→'+STYLE_CPL+' 字');
    if(Math.abs(FX-F0)>1e-9) parts.push('字号 '+F0+'→'+FX+'px');
    var note='整章一屏：'+(parts.length?parts.join('、'):'未动样式');
    postPageMap();
    sendStyleApplied(note);                                 // effective 三值只走 styleApplied，不进 pageMap
    sys(note, false, 3600);
  }


  // ── 内容渲染（无任何控件） ──
  function render(){
    if(!LS.getItem('cds.bound')) return;
    var c=$('content'), html='';
    // V2.1.5：同一 castId 的重发＝原地替换文本，不重建 DOM（学生看不到闪屏）
    if(S.scene==='cast' && S.cast.castId){
      var ex=document.querySelector('#content .cast .paper');
      if(ex && ex.getAttribute('data-cast-id')===String(S.cast.castId)){
        ex.textContent=S.cast.text||'（板书内容）'; requestAnimationFrame(fitCast); return;
      }
    }
    if(S.scene==='music'){
      var it=S.music.items[S.music.idx]||{t:'',m:'--:--',dur:245000};
      var cur=Math.min(LYRICS.length-1, Math.floor((S.music.pos/it.dur)*LYRICS.length));
      html='<div class="music">'+
        '<div class="t">'+esc(it.t)+'</div>'+
        '<div class="sub">'+(S.music.playing?'正在播放':'已暂停')+' · 第 '+(S.music.idx+1)+' 首</div>'+
        '<div class="lyrics" id="lrc">'+LYRICS.slice(Math.max(0,cur-1), cur+2).map(function(l,k){
            var i=Math.max(0,cur-1)+k;
            return '<div class="lyric'+(i===cur?' cur':'')+'">'+esc(l)+'</div>'; }).join('')+'</div>'+
        '</div>'+
        '<div class="progress"><i id="pbar" style="width:'+Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%"></i></div>';
    } else if(S.scene==='article'){
      var a=S.article.items[S.article.idx]||{t:'诗篇 23 章',v:'诗篇',ch:23};
      var vs=VERSES[a.ch]||VERSES[23]; A.verses=vs;
      var cpl=cplNow(null);   // V2.1.12：见 usableW()，#content 的 clientWidth 含 padding
      html='<div class="article"><div class="head"><b>'+esc(a.t)+'</b><span class="seg"></span></div>'+
        '<div class="body"><div class="flow">'+vs.map(function(v){
          var ls=sliceLines(v[1], cpl);
          return '<p data-lines="'+ls.length+'">'+ls.map(function(l,i){
            return '<span class="ln">'+(i===0?'<span class="sn">'+v[0]+'</span>':'')+esc(l)+'</span>'; }).join('')+'</p>';
        }).join('')+'</div></div>'+
        '<div class="foot"></div></div>';
    } else if(S.scene==='cast'){
      html='<div class="cast"><div class="paper" data-cast-id="'+(S.cast.castId||'')+'">'+esc(S.cast.text||'（板书内容）')+'</div></div>';
    } else if(S.scene==='standby'){
      if(S.standby.mode==='blank'){
        html='<div style="position:fixed;inset:0;background:#000"></div>';   // 纯黑：不让学生看到下一条内容
      } else {
        var now=new Date();
        html='<div class="idle"><div class="room">主堂 · 显示终端</div><div class="clock" id="dclock">'+
          String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+'</div>'+
          '<div class="wait">等待控制台</div></div>';
      }
    } else {
      html='';
    }
    c.innerHTML=html;
    requestAnimationFrame(fitCast);   // 等布局/字体生效后再量板书是否装得下
    $('content').hidden=false; $('entry').hidden=true;
    if(DEBUG) $('dbg').className='show';
    if(S.scene==='article') requestAnimationFrame(function(){ layoutArticle(); });
  }

  // V2.1.6：板书用同一 fontSizePx；装不下按步长 4 降档，并把「实际生效值」回报控制页
  // （旧版 min(…, 6.5vh) 在 1080p 把上限锁死 70.2px，字号设 72 以上对板书全部无效）
  function fitCast(){
    var wrap=document.querySelector('#content .cast'); if(!wrap) return;
    var p=wrap.querySelector('.paper'); if(!p) return;
    var setPx=parseFloat(document.documentElement.style.getPropertyValue('--cds-font-size'))||72;
    setPx=Math.max(24, Math.min(160, setPx));
    var px=setPx, guard=0;
    p.style.fontSize=px+'px';
    while(p.scrollHeight > p.clientHeight+1 && p.clientHeight>0 && guard++<40){
      px-=4; if(px<24){ px=24; p.style.fontSize='24px'; break; }
      p.style.fontSize=px+'px';
    }
    p.setAttribute('data-eff', String(px));
    if(BC) BC.postMessage({kind:'castMetrics', settingPx:setPx, effectivePx:px});
  }

  // ── 进度推进 ──
  setInterval(function(){
    if(S.scene!=='music'||!S.music.playing) return;
    if(S.music.anchor){                                   // V2.1：pos = anchor.pos + (now - anchor.at)
      S.music.pos = S.music.anchor.pos + (performance.now()-S.music.anchor.at);
    } else { S.music.pos+=250; }
    var it=S.music.items[S.music.idx]||{dur:245000};
    if(S.music.pos>=it.dur){ S.music.pos=0; }
    var bar=$('pbar'); if(bar) bar.style.width=Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%';
    var cur=Math.min(LYRICS.length-1, Math.floor((S.music.pos/it.dur)*LYRICS.length));
    if(cur!==S.music.lastCur){ S.music.lastCur=cur; render(); }   // 只渲染当前行 ±1，换句才重绘
    if(DEBUG) $('dbg').textContent='scene='+S.scene+' pos='+fmt(S.music.pos)+' styleV='+((JSON.parse(LS.getItem('cds.style')||'{}').styleVersion)||'-');
  },250);

  // ── 输码 ──
  var inputs=[].slice.call(document.querySelectorAll('#digits input'));
  function codeValue(){ return inputs.map(function(i){return i.value;}).join(''); }
  function entryErr(msg){ $('err').textContent=msg; }
  inputs.forEach(function(inp,i){
    inp.addEventListener('input', function(){
      inp.value=inp.value.replace(/\D/g,'').slice(0,1);
      if(inp.value && i<inputs.length-1) inputs[i+1].focus();
    });
    inp.addEventListener('keydown', function(e){
      if(e.key==='Backspace' && !inp.value && i>0){ inputs[i-1].focus(); inputs[i-1].value=''; e.preventDefault(); }
      if(e.key==='Enter') confirmCode();
    });
    inp.addEventListener('paste', function(e){
      var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
      if(t){ e.preventDefault(); t.split('').forEach(function(ch,k){ if(inputs[k]) inputs[k].value=ch; }); (inputs[Math.min(t.length,5)]||inputs[5]).focus(); }
    });
  });

  // V2.1：输码 = 仅绑定（音频锚点在控制页，显示端不碰音频）
  function confirmCode(){
    var code=codeValue();
    if(code.length!==6){ entryErr('请输入 6 位控制码'); return; }
    // V2.1：显示端无音频 → 输码只做绑定，不再解锁音频（原 §10.6 整节删除）

    var o = null;
    try{ o = JSON.parse(LS.getItem('cds.codeObj')||'null'); }catch(e){}
    if(o){
      if(o.used){ entryErr('该码已被使用，请在控制台点 ⟳ 获取新码'); return; }
      if(o.exp - Date.now() <= 0){ entryErr('控制码已过期，请在控制台刷新后重新输入'); return; }
      if(code !== o.code){ entryErr('控制码无效，请与控制台核对'); return; }
      o.used = true; LS.setItem('cds.codeObj', JSON.stringify(o));   // 单次消费
    } else {
      var expect = LS.getItem('cds.consoleCode');
      if(expect && code !== expect){ entryErr('控制码无效，请与控制台核对'); return; }
    }
    LS.setItem('cds.bound', '1');
    LS.setItem('cds.credential', 'cred-'+Math.random().toString(36).slice(2,10));
    LS.setItem('cds.boundAt', String(Date.now()));
    beat();
    entryErr('');
    $('banner').hidden=true;
    if(BC){ BC.postMessage({kind:'ackBound', text:'教室屏幕已绑定'}); }
    S.scene='standby'; render();
    sysOff();
  }
  $('go').addEventListener('click', confirmCode);

  // 输码页：只有中性提示（真机拿不到"剩余多久"，见变更单异议 4）
  // 结论（过期/已使用）一律在"确认"之后按服务端 reason 给文案，不在提交前预判
  (function(){
    var meta = $('codeMeta');
    if(meta) meta.textContent = '控制码 15 分钟内有效 · 过期请在控制台点 ⟳ 刷新';
  })();

  // 长按 3 秒重置
  var pressT=null, raf=null, t0=0;
  function startPress(e){
    if(e.target.closest('input')||e.target.closest('button')) return;
    t0=performance.now(); $('ring').style.opacity='1';
    (function tick(){
      var p=Math.min(1,(performance.now()-t0)/3000);
      var c=$('ring').querySelector('circle');
      c.style.strokeDashoffset=String(100.5*(1-p));
      if(p>=1){ clearCode(); return; }
      raf=requestAnimationFrame(tick);
    })();
    pressT=setTimeout(clearCode, 3000);
  }
  function endPress(){ clearTimeout(pressT); cancelAnimationFrame(raf); $('ring').style.opacity='0'; $('ring').querySelector('circle').style.strokeDashoffset='100.5'; }
  $('entry').addEventListener('pointerdown', startPress);
  $('entry').addEventListener('pointerup', endPress);
  $('entry').addEventListener('pointercancel', endPress);
  $('entry').addEventListener('pointerleave', endPress);

  function clearCode(){
    endPress();
    LS.removeItem('cds.bound'); LS.removeItem('cds.credential'); LS.removeItem('cds.boundAt'); LS.removeItem('cds.displayBeat');
    $('content').hidden=true; $('entry').hidden=false;
    inputs.forEach(function(i){ i.value=''; });
    entryErr('已清除缓存的控制码');
    setTimeout(function(){ if(!codeValue()) entryErr(''); }, 3500);
    inputs[0].focus();
  }

  if(/[?&]reset=1/.test(location.search)) clearCode();

  // ── 控制台下行 ──
  if(BC) BC.onmessage=function(ev){
    var d=ev.data||{};
    if(d.kind==='style'){ applyStyle(d.style); sys('样式已更新（不刷新页面）', false, 2200);
      // V2.1.5：字号是 px 且有量程变化，分页是「实测高度」——样式一变必须重排，否则旧页装不下新字号
      if(S.scene==='article') requestAnimationFrame(function(){ render(); });
      sendStyleApplied('');
      if(BC) BC.postMessage({kind:'ack', text:d.style ? '样式已应用' : ''}); return; }
    if(d.kind==='revoke'){ LS.removeItem('cds.bound'); LS.removeItem('cds.credential'); LS.removeItem('cds.displayBeat'); $('banner').textContent='控制码已失效，请重新输入'; $('banner').hidden=false;
      $('content').hidden=true; $('entry').hidden=false; inputs.forEach(function(i){i.value='';}); return; }
    if(d.kind==='codeChanged'){ sys('控制码已刷新（已连终端不受影响）', false, 2500); return; }
    if(!LS.getItem('cds.bound')) return;
    if(d.kind==='standby'){ S.standby.mode=d.mode||'theme'; if(S.scene==='standby') render(); return; }
    if(d.kind==='article' && typeof d.cast==='boolean'){ S.article.cast=d.cast; }
    if(d.kind==='scene'){
      S.scene=d.scene;
      if(d.scene!=='music') S.music.playing=false;
      render(); return;
    }
    if(d.kind==='play'){
      S.music.idx=d.idx||0; S.music.pos=d.pos||0; S.music.playing=true; S.scene='music'; render();
      return;
    }
    if(d.kind==='music'){
      if(typeof d.idx==='number') S.music.idx=d.idx;
      if(typeof d.pos==='number') S.music.pos=d.pos;
      if(typeof d.playing==='boolean') S.music.playing=d.playing;
      S.music.anchor={ pos:S.music.pos, at:performance.now() };  // V2.2.11：单调时钟（Date.now 无 NTP 会跳，mqtt §4.1）
      if(S.scene==='music'){
        var bar=$('pbar'), it=S.music.items[S.music.idx]||{dur:245000};
        if(bar) bar.style.width=Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%';
        if(d.action==='toggle'||d.action==='prev'||d.action==='next'){ var sub=document.querySelector('.music .sub'); if(sub) sub.textContent=(S.music.playing?'正在播放':'已暂停')+' · 第 '+(S.music.idx+1)+' 首'; }
      } else if(d.playing){ S.scene='music'; render(); }
      return;
    }
    if(d.kind==='article'){
      var sameIdx=(S.scene==='article' && S.article.idx===(d.idx||0));
      S.article.idx=d.idx||0; S.article.page=d.page||0;
      if(d.unit) A.unit=(d.unit==='section'?'section':'page');
      if(typeof d.sectionIndex==='number') A.sectionIndex=d.sectionIndex;
      A.pageIndex=d.page||0;
      if(!sameIdx){ A.ready=false; A.sectionIndex=0; A.pageIndex=0; }
      if(typeof d.pageCount==='number') S.article.pageCount=d.pageCount;
      if(typeof d.cast==='boolean'){ S.article.cast=d.cast; if(!d.cast){ S.scene='standby'; render(); return; } }
      S.scene='article'; render(); return;
    }
    if(d.kind==='scroll'){
      if(d.unit) setUnit(d.unit);
      stepArticle(d.direction||'next', d.steps); return;
    }
    if(d.kind==='articleUnit'){ setUnit(d.unit); return; }
    if(d.kind==='fitOnePage'){ fitOnePage(); return; }
    if(d.kind==='cast'){
      S.cast.text=d.text||''; S.cast.active=!!d.active; if(d.castId) S.cast.castId=d.castId;
      S.scene = d.scene || (d.active?'cast':'standby'); render(); return;
    }
    if(d.kind==='volume'){ /* 原型不发声 */ return; }
  };

  // ── 启动 ──
  if(LS.getItem('cds.bound')){
    render(); beat();
  } else {
    $('entry').hidden=false;
    setTimeout(function(){ inputs[0].focus(); }, 200);
  }

  // 演示深链：?scene=standby|music|article|cast｜?blank=1（黑屏）（仅原型，便于无需控制台单独看某一态）
  var mScene = /[?&]scene=(standby|music|article|cast)/.exec(location.search);
  if(mScene && LS.getItem('cds.bound')){ S.scene = mScene[1]; if(S.scene==='music' && /[?&]playing=1/.test(location.search)) S.music.playing=true;
    if(/[?&]blank=1/.test(location.search)){ S.scene='standby'; S.standby.mode='blank'; }
    render(); }

  if(DEBUG){ $('dbg').className='show'; $('dbg').textContent='debug · scene='+S.scene; }
})();
</script>
</body>
</html>
