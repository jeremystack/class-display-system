<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDS 显示端原型 V2.1（输码态 / 待机主题 / 内容态）</title>
<style>
:root{
  --cds-bg:#000; --cds-fg:#e8ecf2; --cds-fg-muted:#a9b3c2; --cds-accent:#8ab4f8;
  --cds-font-ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --cds-font-body:"Songti SC","Noto Serif SC",serif;
  --cds-font-scale:1.15; --cds-font-size:72px; --cds-line-height:1.75; --cds-align:left;
}
*{box-sizing:border-box}
html{font-size:18px}
html,body{margin:0;height:100%;overflow:hidden}
/* V2.1.43：整页禁选/禁双击缩放（长按选字会跟隐藏退出抢事件）；输入框单独放开 */
body{background:var(--cds-bg);color:var(--cds-fg);font-family:var(--cds-font-ui);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.digits input{user-select:text;-webkit-user-select:text;touch-action:auto}
.stage{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:absolute;inset:0;transition:opacity .18s ease}
.view[hidden],#entry[hidden]{display:none}

/* ── 输码态 ── */
#entry{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vh 6vw}
.entry-inner{width:min(560px,86vw)}
.entry-inner h1{font-size:1.6rem;margin:0 0 .4rem;font-weight:600;letter-spacing:.05em}
.entry-inner p{color:var(--cds-fg-muted);margin:0 0 2.2rem;font-size:.9rem;line-height:1.7}
.digits{display:flex;gap:12px;justify-content:center;margin-bottom:1.4rem}
.digits input{width:min(72px,13vw);height:min(96px,18vw);text-align:center;font:600 min(2.6rem,7vw)/1 ui-monospace,monospace;
  color:var(--cds-fg);background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.18);border-radius:12px;outline:none}
.digits input:focus{border-color:var(--cds-accent);background:rgba(255,255,255,.09)}
.entry-inner button.go{font:600 1.05rem/1 var(--cds-font-ui);padding:1rem 3.2rem;border-radius:999px;border:none;
  background:var(--cds-accent);color:#06101f;cursor:pointer;min-height:52px}
.entry-inner button.go:active{transform:translateY(1px)}
.err{color:#ff9d9d;font-size:.85rem;min-height:1.4rem;margin-top:1rem}
.code-meta{font-size:.78rem;color:var(--cds-fg-muted);letter-spacing:.04em;margin:-1.2rem 0 1.4rem;min-height:1.2rem}
.code-meta.warn{color:#ffcf8a}
.code-meta.bad{color:#ff9d9d}
.entry-banner{position:absolute;top:0;left:0;right:0;padding:.85rem 1rem;background:#3a1414;color:#ffd7d7;font-size:.85rem;text-align:center}
.entry-banner[hidden]{display:none}
.reset-hint{position:absolute;right:18px;bottom:14px;font-size:12px;color:rgba(255,255,255,.28);user-select:none;cursor:default}
.ring{position:absolute;right:12px;bottom:8px;width:40px;height:40px;opacity:0;transition:opacity .1s}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke:rgba(255,255,255,.45);stroke-width:3;stroke-dasharray:100.5;stroke-dashoffset:100.5}

/* ── 内容态 ── */
/* V2.1.43：#content 必须 flex 纵向——否则 .lyrics{flex:1} 无处可 flex，高度＝内容高（实测 1437px），
   歌词永远单页、看不到滚动与居中 */
#content{padding:5vh 5vw;display:flex;flex-direction:column;min-height:0}
/* #content 的 id 选择器优先于 .view[hidden]，不给这条就**盖住了 hidden**：内容态永远显示、输码按钮点不到（实测踩到） */
#content[hidden]{display:none}
.music{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* V2.1.5：去掉音轨封面。Jeremyzh：显示端只留顶部歌名 + 歌词；音轨徽标属功能，留在控制台。 */
.music .t{font-size:1.5rem;font-weight:600;letter-spacing:.04em}
.music .sub{color:var(--cds-fg-muted);font-size:.8rem;margin-top:.5rem}
/* V2.1.5：歌词跟同一字号变量（--cds-font-size）走；字号可到 120px，当前行必须居中滚动，
   否则「当前句」会滚出 21vh 的可视区——那等于改了字号看不见歌词 */
.lyrics{margin-top:3vh;flex:1;min-height:0;overflow:hidden;width:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center}
/* V2.1.43：**删掉 padding:.05em 0**（V2.1.6 起欠的债）。连续滚动下步进差 0.1em 随行号线性累积，
   第 60 行偏约 1.5 行、越唱越歪且不自愈（按页切时只差 1 行，所以当年没被发现）。
   行盒＝字号 × 场景 lineHeight（V2.1.50：此前硬写 1.5、不吃 --cds-line-height，
   导致 ack.effective 回带的 1.75 与屏上行距不一致；开发 23:02 指出——写死等于回带一个不生效的值） */
.lyric{font-size:calc(var(--cds-font-size) * .78);line-height:var(--cds-line-height,1.5);color:rgba(255,255,255,.3)}
.lyric.cur{color:var(--cds-accent)}
.progress{position:absolute;left:5vw;right:5vw;bottom:4vh;height:4px;background:rgba(255,255,255,.14);border-radius:99px}
.progress i{display:block;height:100%;background:var(--cds-accent);border-radius:99px;transition:width .25s linear}

.article{height:100%;display:flex;flex-direction:column}
.article .foot{display:flex;justify-content:flex-end;font-size:.68rem;opacity:.5;min-height:1.4em}
.article .head{color:var(--cds-fg-muted);font-size:.8rem;letter-spacing:.06em;margin-bottom:2.5vh}
.article .head b{color:var(--cds-fg);font-size:1rem;margin-right:.8rem}
/* V2.1.26（P1 悬挂节号，Jeremyzh 20:11 裁「悬挂」）：padding-left 1em 给节号让位、margin-left:-1em 抵回，
   内容宽（usableW 减 padding）逐像素不变 ⇒ 四档表一格不动。overflow:hidden 裁的是 padding box，
   节号落进 padding 区内不会被裁——但节号必须移出 .ln（.ln 自己也是 overflow:hidden）。 */
.body{flex:1;overflow:hidden;position:relative;padding-left:1em;margin-left:-1em;
  font-family:var(--cds-font-body);
  font-size:var(--cds-font-size);line-height:var(--cds-line-height);text-align:var(--cds-align)}
/* V2.1.6：整章常驻，只移动视口起点（不切片文本，段距只存在于一处 CSS） */
/* V2.1.26：绝对定位子元素的 left:0 参照的是 padding box，不是 content box——
   不写成 1em，.flow 会盖住 .body 的 padding 区，节号反而被 overflow 裁掉（实测踩过）。 */
.body .flow{position:absolute;left:1em;right:0;top:0;will-change:transform}
.body p{margin:0 0 1.1em;position:relative;transition:font-size .2s ease,color .2s ease}
/* V2.1.26：节号绝对定位到行首之外（right:100% ＝ 贴住 p 的左边缘），落进 .body 的 1em padding 里。
   不再占首行字宽 ⇒ 首行终于能排满 c 字（此前 27/49/98px 的裁行即此）。margin-right 归零：
   间距由 5vw 槽的剩余量给（25/23/46px @1280/1920/4K），不叠加 margin。 */
.body .sn{color:var(--cds-fg-muted);font-size:.6em;font-family:var(--cds-font-ui);line-height:1;
  position:absolute;right:100%;top:.34em;margin-right:0}
/* V2.1.10：每行一个 nowrap 块——行数由切行数组决定，不靠浏览器自然折行（混排宽度不可算） */
.body p .ln{display:block;white-space:nowrap;overflow:hidden}
.body p .ln.cont{padding-left:1em}

.cast{height:100%;display:flex;align-items:center;justify-content:center}
/* V2.1.6：板书用同一 fontSizePx（删掉 min(…, 6.5vh)：6.5vh 在 1080p＝70.2px，72px 以上全无效）；
   装不下时由 fitCast() 按步长 4 降档，并把实际生效值回报控制页——不静默缩 */
/* V2.1.43：板书改竖向滚动（V2.1.38 反转 V2.1.34 的裁切）。scrollbar-gutter:stable 防自反馈：
   滚动条出现 ⇒ 宽变窄 ⇒ 换行增多 ⇒ 更高 ⇒ 又要滚动条。注意这里**不动 .lyrics**——
   歌词是 transform 视口（只动 transform），给它加滚动会与居中定位打架。 */
.cast .paper{max-width:74vw;max-height:100%;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain;font-family:var(--cds-font-body);
  font-size:var(--cds-font-size);
  line-height:var(--cds-line-height);text-align:var(--cds-align);white-space:pre-wrap}

.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cds-fg-muted)}
.idle .room{font-size:1.35rem;color:var(--cds-fg);letter-spacing:.12em}
.idle .clock{font:300 4.2rem/1.2 ui-monospace,monospace;margin:2vh 0 1vh;color:rgba(255,255,255,.85)}
.idle .wait{font-size:.8rem;letter-spacing:.14em;color:rgba(255,255,255,.35)}

/* ── 系统层 ── */
#sys{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem;background:rgba(20,22,28,.92);
  border-top:1px solid rgba(255,255,255,.12);font-size:.8rem;color:#ffd9a0;display:none;z-index:50}
#sys.show{display:block}
#sys.bad{background:rgba(58,20,20,.94);color:#ffd7d7}

/* ── V2.1.43 屏端隐藏退出（设计 §3.4.1）──
   热区**不可见**：不画图标、不写文案、不画环形进度（画了就等于告诉学生入口在哪）。
   位置避开输码页 .reset-hint（右下 18px/14px）与板书滚动条轨道：贴右下角 88×88，
   且仅在内容态启用（输码态该热区不绑动作）。 */
#exit-hot{position:fixed;right:0;bottom:0;width:88px;height:88px;z-index:20;
  background:transparent;touch-action:none;user-select:none;-webkit-touch-callout:none}
#exit-hot[hidden]{display:none}
/* 滚动条轨道与右下角热区是同一块像素（mqtt §4.6.5 ⑮ / V2.2.32、V2.2.36）：轨道宽度**实测**、
   内缩**无条件**（scrollbar-gutter:stable ⇒ 轨道常驻，不得写成「出现滚动条时才内缩」，否则同一块屏
   有无溢出时能按到的地方不一样）。内缩量由 syncExitHot() 写入 right；点坐标命中轨道另有一道闸。 */
#exit-hot{right:0}
#exit-dlg{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.72);
  display:flex;align-items:center;justify-content:center}
#exit-dlg[hidden]{display:none}
#exit-dlg .dlg{background:#171b22;border:1px solid rgba(255,255,255,.16);border-radius:14px;
  padding:2rem 2.2rem;max-width:min(460px,86vw);text-align:center}
#exit-dlg h2{margin:0 0 .6rem;font-size:1.15rem;font-weight:600}
#exit-dlg p{margin:0 0 1.6rem;color:var(--cds-fg-muted);font-size:.9rem;line-height:1.7}
#exit-dlg .row{display:flex;gap:.8rem;justify-content:center}
#exit-dlg button{font:600 .95rem/1 var(--cds-font-ui);padding:.8rem 1.6rem;border-radius:10px;
  border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--cds-fg);cursor:pointer;min-height:48px}
#exit-dlg button.danger{border-color:#a33;background:#3a1414;color:#ffd7d7}
#exit-dlg button:focus-visible{outline:2px solid var(--cds-accent);outline-offset:2px}
#dbg{position:fixed;right:10px;top:10px;font:11px/1.5 ui-monospace,monospace;color:rgba(255,255,255,.4);text-align:right;display:none}
#dbg.show{display:block}
</style>
</head>
<body>
<div class="stage">

  <!-- 输码态 -->
  <section class="view" id="entry">
    <div class="entry-banner" id="banner" hidden>控制码已更新，请重新输入</div>
    <div class="entry-inner">
      <h1>教室显示</h1>
      <p>请输入控制台上的控制码<br>（首次使用一次，之后开机自动连上）</p>
      <div class="code-meta" id="codeMeta"></div>
      <div class="digits" id="digits">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
      </div>
      <button class="go" id="go">确认</button>
      <div class="err" id="err"></div>
    </div>
    <span class="reset-hint" id="resetHint">长按 3 秒清除本地码</span>
    <div class="ring" id="ring"><svg width="40" height="40"><circle cx="20" cy="20" r="16"/></svg></div>
  </section>

  <!-- 内容态（零控件） -->
  <section class="view" id="content" hidden></section>

  <!-- V2.1.43 屏端隐藏退出：右下角不可见热区，长按 3 秒 → 二次确认 → POST /devices/me/release -->
  <div id="exit-hot" hidden aria-hidden="true"></div>
  <div id="exit-dlg" hidden role="dialog" aria-modal="true" aria-labelledby="exit-dlg-t">
    <div class="dlg">
      <h2 id="exit-dlg-t">确定解除本屏接管？</h2>
      <p>解除后需重新输入控制码。</p>
      <div class="row"><button id="exit-no" type="button">取消</button><button id="exit-yes" type="button" class="danger">解除接管</button></div>
    </div>
  </div>
  <div id="sys"></div>
  <div id="dbg"></div>
</div>

<script>
(function(){
  'use strict';
  var LS = window.localStorage, BC = ('BroadcastChannel' in window) ? new BroadcastChannel('cds-proto') : null;
  var $ = function(id){ return document.getElementById(id); };
  var DEBUG = /[?&]debug=1/.test(location.search);
  var sysTimer = null;                    // V2.1：显示端无音频（无音频上下文、无解锁状态）

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(ms){ var s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

  // ── 系统层 ──
  function sys(text, bad, ms){
    var el=$('sys'); el.textContent=text; el.className='show'+(bad?' bad':'');
    clearTimeout(sysTimer);
    if(ms) sysTimer=setTimeout(function(){ el.className=''; }, ms);
  }
  function sysOff(){ $('sys').className=''; }

  // ── 样式（本地缓存优先，避免闪字） ──
  // V2.1.11：每行字数默认 auto（按屏宽 ÷ 字号派生）；手动档只在老师拖过滑块后生效
  var STYLE_CPL='auto';
  var STYLE_FPX='auto';            // 'auto' = 按视口高派生；数字 = 控制台显式指定（换屏不重算）
  var WARN_SCALE=false;
  // V2.2.15：把派生抽出来，供「启动」与「换屏」共用。产品 V2.1.12 已修「启动时不派生」，
  // 但派生值在窗口化↔全屏换屏时不会重算（旧码只在 applyStyle 里算一次）。
  function deriveFpx(){
    var _h=window.innerHeight||1080;
    return Math.max(24, Math.min(160, Math.round(_h*0.067/4)*4));   // 720p 48 / 1080p 72 / 1440p 96 / 2160p 144
  }
  function applyFpx(){
    var f=(STYLE_FPX==='auto')?deriveFpx():STYLE_FPX;
    f=Math.max(24, Math.min(160, f));
    document.documentElement.style.setProperty('--cds-font-size', f+'px');
    return f;
  }
  function applyStyle(st){
    st = st || {};                 // V2.2.15：null 也当空样式处理，绝不停在 CSS 默认 72px
    var r=document.documentElement.style;
    if(st.fontFamily && st.fontFamily.body){
      var map={song:'"Songti SC","Noto Serif SC",serif',hei:'"PingFang SC","Microsoft YaHei",sans-serif',kai:'"Kaiti SC",KaiTi,serif','system-ui':'system-ui,sans-serif'};
      r.setProperty('--cds-font-body', map[st.fontFamily.body]||st.fontStack||'system-ui,sans-serif');
    }
    // V2.2.13：fontScale **作废**——收到忽略并在 ack.note 里 warn。
    // 旧实现按 ×18 折算 px，fontScale:1.0 会得 18px（字直接小到墙脚），已删。
    if(st.fontScale!=null) WARN_SCALE=true;
    // V2.2.15：显式值锁进 STYLE_FPX（换屏/缩放不重算）；缺省或 'auto' ⇒ 每次按视口高派生
    var _f=+st.fontSizePx;
    STYLE_FPX=(st.fontSizePx!=null && st.fontSizePx!=='auto' && isFinite(_f)) ? Math.max(24, Math.min(160, _f)) : 'auto';
    applyFpx();
    if(st.lineHeight) r.setProperty('--cds-line-height', st.lineHeight);
    if(st.fg){ r.setProperty('--cds-fg', st.fg); }
    if(st.bg){ r.setProperty('--cds-bg', st.bg); }
    if(st.align) r.setProperty('--cds-align', st.align);
    if(st.charsPerLine==='auto') STYLE_CPL='auto';
    else if(st.charsPerLine!=null && st.charsPerLine!=='') STYLE_CPL=Math.max(6, Math.min(40, +st.charsPerLine||12));
  }
  // mqtt §4.6：effective 回带生效值，只走独立消息，不进 pageMap（pageMap 恒 7 字段）
  function sendStyleApplied(note){
    if(!BC) return;
    var r=getComputedStyle(document.documentElement);
    var epx=parseFloat(r.getPropertyValue('--cds-font-size'))||72;
    var elh=parseFloat(r.getPropertyValue('--cds-line-height'))||1.75;
    // V2.1.11：auto 回**派生出的整数**，否则控制台看到的是字符串 "auto"
    var _b=document.querySelector('#content .article .body');
    BC.postMessage({kind:'styleApplied',
      effective:{fontSizePx:epx, lineHeight:elh, charsPerLine:cplNow(_b)}, note:note||''});
  }
  // V2.1.12：**无缓存样式时也要走派生**（字号 = round4(屏高×6.7%)、每行字数 = auto）。
  // 原写法 applyStyle(null) 在里面直接 return，未收过 display.style 的显示端会停在 CSS 的 72px——
  // 在 4K 上等于只画到半屏宽（W=3456，72px×24=1728），与 §7.5.3「默认＝派生」不一致。
  var _st=null; try{ _st=JSON.parse(LS.getItem('cds.style')||'null'); }catch(e){}
  applyStyle(_st||{});

  // ── 心跳（供控制台算"在线终端数"）＋ 身份上报（CO-2026-11-18-05） ──
  // 真机：presence(retain) + 登记表；原型：同源 localStorage 顶替服务端，控制台读 cds.device。
  function deviceId(){
    try{
      // V2.1.54 / api.md §4.1：deviceId 只能来自注册响应。注册写过 `cds.deviceId` 就一律用它；
      // 本地 `dev_` 随机串**只**服务未配 API 基点的演示态——否则真机审计里的设备行与屏上报的 id 对不上。
      var sid = LS.getItem('cds.deviceId');
      if(sid) return sid;
      var d = JSON.parse(LS.getItem('cds.device')||'null') || {};
      if(!d.id){
        d.id = 'dev_'+Math.random().toString(36).slice(2,8);   // 仅演示态（未配 ?api=）；真机不走到这里
        d.label = '教室屏幕 ' + d.id.slice(-2);
        LS.setItem('cds.device', JSON.stringify(d));
      }
      return d.id;
    }catch(e){ return ''; }
  }
  function beat(){
    if(typeof syncExitHot==='function') syncExitHot();   // V2.1.43：热区只在内容态出现
    if(!LS.getItem('cds.bound')) return;
    LS.setItem('cds.displayBeat', String(Date.now()));
    try{
      var d = JSON.parse(LS.getItem('cds.device')||'null') || {};
      d.id = deviceId(); d.ts = Date.now(); d.scene = (typeof S!=='undefined' && S.scene) ? S.scene : (d.scene || 'standby');
      LS.setItem('cds.device', JSON.stringify(d));
    }catch(e){}
  }
  setInterval(beat, 1000);

  // CO-2026-11-18-05 / api.md §4.6：绑定是否仍有效**只由服务端按设备凭据判**——GET /devices/me 回

  // 不含码）模拟「控制台刷新了码」——api.md §4.2：控制码**不得持久化**，它不按码查。
  function checkBinding(){
    if(!LS.getItem('cds.bound')) return;
    if(API_BASE) return;                       // 服务端判定见 checkBindingServer()；两条路不得同时跑
    var expect = LS.getItem('cds.codeRev')||'';
    if(expect && expect !== (LS.getItem('cds.boundRev')||'')){ sys('控制码已更新：本屏已退出接管', true, 3000); doRevoke('code_rotated'); return; }
    // 单台移出（真机＝devices.revoked_at > devices.bound_at）。撤销早于本次绑定即无效记录，忽略。
    try{
      var rv = JSON.parse(LS.getItem('cds.revoked')||'{}') || {};
      var at = +(LS.getItem('cds.boundAt')||0);

  // ② state='unbound' ⇒ 从未绑定/授权已清，同样回输码页（**不得**因「无 retained」推断，见 V2.2.26）；

  function checkBindingServer(){
    if(!API_BASE || !LS.getItem('cds.bound')) return;
    // V2.1.55 反向闸：bound=1 而 token 缺失是**死态**——本地标志说「已接管」，但 /devices/me 与 MQTT

    // 现场最难查（屏停在内容态、函数首行就 return、永远自愈不了）。回输码页。
    var tok=LS.getItem('cds.deviceToken')||'';

        }
        if(res.status!==200) return;
        if(b.state==='revoked'){ doRevoke(b.reason||'kicked'); return; }
        if(b.state==='unbound'){ doRevoke('unbind'); return; }
      }).catch(function(){});
  }

  function charW(ch){ return ch.charCodeAt(0) < 128 ? 0.5 : 1; }   // 全角 1／半角 0.5

  // 缩进是**样式不是字符**：正文文本里不插入任何空格/全角空格，复制出来仍是原文。
  function sliceHang(text, c){
    var out=[], cur='', acc=0, lim=c;

    var out=[], cur='', acc=0;
    for(var i=0;i<text.length;i++){

  // 是一行超过 24 个全角字后排跟行会跳字——不得以「装得下」为理由放开。
  function cplMax(W){

    if(!done){
      var b=artBody(), cap=cplMax(usableW(b));            // V2.2.16：不能传 clientWidth（含 5vw padding）
      if(cplNow(b)<cap){ STYLE_CPL=cap; rebuildArticle(); if(fits()){ changed.push('每行 '+CP0+'→'+cap+' 字'); done=true; } }
    }
    // ③ 字号
    var px=F0;
    while(!done && px>24){
      px=Math.max(24, px-4);
      STYLE_FPX=px; root.setProperty('--cds-font-size', px+'px');
      if(fits()){ changed.push('字号 '+F0+'→'+px+'px'); done=true; }
    }
    if(!done){                                              // 回滚：宁可不动，也不留半套
      root.setProperty('--cds-line-height', LH0);
      STYLE_CPL=CP0; STYLE_FPX=FPX0; applyFpx();
      rebuildArticle();                                     // V2.2.16：复原 cpl 后必须重切，别留 ② 档的行数
      layoutArticle(true);
      postPageMap(); sendStyleApplied('整章一屏：已到最小（行距 1.2 / 字号 24）仍 '+A.pageCount+' 屏，未改样式');
      sys('整章一屏：已到最小仍 '+A.pageCount+' 屏，样式已还原', false, 3600);
      return;
    }
    // V2.2.15：note 必须写全「与点击前不同」的每一档——②抬高 cpl 但靠③才成一屏时 cpl 也变了，
    // 只报字号会让老师看到「每行 N 字」变了而 note 没提（effective 带真值，note 漏报同样算口径不一致）
    var FX=parseFloat(root.getPropertyValue('--cds-font-size'))||F0;
    var LHX=parseFloat(root.getPropertyValue('--cds-line-height'))||LH0;
    var parts=[];
    if(Math.abs(LHX-LH0)>1e-9) parts.push('行距 '+LH0.toFixed(2)+'→'+LHX.toFixed(2));
    if(String(STYLE_CPL)!==String(CP0)) parts.push('每行 '+CP0+'→'+STYLE_CPL+' 字');
    if(Math.abs(FX-F0)>1e-9) parts.push('字号 '+F0+'→'+FX+'px');
    var note='整章一屏：'+(parts.length?parts.join('、'):'未动样式');
    postPageMap();
    sendStyleApplied(note);                                 // effective 三值只走 styleApplied，不进 pageMap
    sys(note, false, 3600);
  }


  // ── 内容渲染（无任何控件） ──
  function render(){
    if(!LS.getItem('cds.bound')) return;
    var c=$('content'), html='';
    // V2.1.5：同一 castId 的重发＝原地替换文本，不重建 DOM（学生看不到闪屏）
    if(S.scene==='cast' && S.cast.castId){
      var ex=document.querySelector('#content .cast .paper');
      if(ex && ex.getAttribute('data-cast-id')===String(S.cast.castId)){
        ex.textContent=S.cast.text||'（板书内容）'; requestAnimationFrame(fitCast); return;
      }
    }
    if(S.scene==='music'){
      var it=S.music.items[S.music.idx]||{t:'',m:'--:--',dur:245000};
      var cur=Math.min(LYRICS.length-1, Math.floor((S.music.pos/it.dur)*LYRICS.length));
      html='<div class="music">'+
        '<div class="t">'+esc(it.t)+'</div>'+
        '<div class="sub">'+(S.music.playing?'正在播放':'已暂停')+' · 第 '+(S.music.idx+1)+' 首</div>'+
        '<div class="lyrics" id="lrc">'+LYRICS.slice(Math.max(0,cur-1), cur+2).map(function(l,k){
            var i=Math.max(0,cur-1)+k;
            return '<div class="lyric'+(i===cur?' cur':'')+'">'+esc(l)+'</div>'; }).join('')+'</div>'+
        '</div>'+
        '<div class="progress"><i id="pbar" style="width:'+Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%"></i></div>';
    } else if(S.scene==='article'){
      var a=S.article.items[S.article.idx]||{t:'诗篇 23 章',v:'诗篇',ch:23};
      var vs=VERSES[a.ch]||VERSES[23]; A.verses=vs;
      var cpl=cplNow(null);   // V2.1.12：见 usableW()，#content 的 clientWidth 含 padding
      html='<div class="article"><div class="head"><b>'+esc(a.t)+'</b><span class="seg"></span></div>'+
        '<div class="body"><div class="flow">'+vs.map(function(v){
          var ls=sliceHang(v[1], cpl);
          return '<p data-lines="'+ls.length+'"><span class="sn">'+v[0]+'</span>'+ls.map(function(l,i){
            return '<span class="ln'+(i===0?'':' cont')+'">'+esc(l)+'</span>'; }).join('')+'</p>';
        }).join('')+'</div></div>'+
        '<div class="foot"></div></div>';
    } else if(S.scene==='cast'){
      html='<div class="cast"><div class="paper" data-cast-id="'+(S.cast.castId||'')+'">'+esc(S.cast.text||'（板书内容）')+'</div></div>';
    } else if(S.scene==='standby'){
      if(S.standby.mode==='blank'){
        html='<div style="position:fixed;inset:0;background:#000"></div>';   // 纯黑：不让学生看到下一条内容
      } else {
        var now=new Date();
        html='<div class="idle"><div class="room">主堂 · 显示终端</div><div class="clock" id="dclock">'+
          String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+'</div>'+
          '<div class="wait">等待控制台</div></div>';
      }
    } else {
      html='';
    }
    c.innerHTML=html;
    requestAnimationFrame(fitCast);   // 等布局/字体生效后再量板书是否装得下
    $('content').hidden=false; $('entry').hidden=true;
    if(DEBUG) $('dbg').className='show';
    if(S.scene==='article') requestAnimationFrame(function(){ layoutArticle(); });
  }

  // V2.1.6：板书用同一 fontSizePx；装不下按步长 4 降档，并把「实际生效值」回报控制页
  // （旧版 min(…, 6.5vh) 在 1080p 把上限锁死 70.2px，字号设 72 以上对板书全部无效）
  function fitCast(){
    var wrap=document.querySelector('#content .cast'); if(!wrap) return;
    var p=wrap.querySelector('.paper'); if(!p) return;
    var setPx=parseFloat(document.documentElement.style.getPropertyValue('--cds-font-size'))||72;
    setPx=Math.max(24, Math.min(160, setPx));
    var px=setPx, guard=0;
    p.style.fontSize=px+'px';
    while(p.scrollHeight > p.clientHeight+1 && p.clientHeight>0 && guard++<40){
      px-=4; if(px<24){ px=24; p.style.fontSize='24px'; break; }
      p.style.fontSize=px+'px';
    }
    p.setAttribute('data-eff', String(px));
    if(BC) BC.postMessage({kind:'castMetrics', settingPx:setPx, effectivePx:px});
  }

  // ── 进度推进 ──
  setInterval(function(){
    if(S.scene!=='music'||!S.music.playing) return;
    if(S.music.anchor){                                   // V2.1：pos = anchor.pos + (now - anchor.at)
      S.music.pos = S.music.anchor.pos + (performance.now()-S.music.anchor.at);
    } else { S.music.pos+=250; }
    var it=S.music.items[S.music.idx]||{dur:245000};
    if(S.music.pos>=it.dur){ S.music.pos=0; }
    var bar=$('pbar'); if(bar) bar.style.width=Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%';
    var cur=Math.min(LYRICS.length-1, Math.floor((S.music.pos/it.dur)*LYRICS.length));
    if(cur!==S.music.lastCur){ S.music.lastCur=cur; render(); }   // 只渲染当前行 ±1，换句才重绘
    if(DEBUG) $('dbg').textContent='scene='+S.scene+' pos='+fmt(S.music.pos)+' styleV='+((JSON.parse(LS.getItem('cds.style')||'{}').styleVersion)||'-');
  },250);

  // ── 输码 ──
  var inputs=[].slice.call(document.querySelectorAll('#digits input'));
  function codeValue(){ return inputs.map(function(i){return i.value;}).join(''); }
  function entryErr(msg){ $('err').textContent=msg; }
  inputs.forEach(function(inp,i){
    inp.addEventListener('input', function(){
      inp.value=inp.value.replace(/\D/g,'').slice(0,1);
      if(inp.value && i<inputs.length-1) inputs[i+1].focus();
    });
    inp.addEventListener('keydown', function(e){
      if(e.key==='Backspace' && !inp.value && i>0){ inputs[i-1].focus(); inputs[i-1].value=''; e.preventDefault(); }
      if(e.key==='Enter') confirmCode();
    });
    inp.addEventListener('paste', function(e){
      var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,8);
      if(t){ e.preventDefault(); t.split('').forEach(function(ch,k){ if(inputs[k]) inputs[k].value=ch; }); (inputs[Math.min(t.length,7)]||inputs[7]).focus(); }
    });
  });

  // CO-2026-11-18-05：控制码＝**每用户一张、存库、长期有效**（无 TTL、无「已使用」、无自动续码）。
  // 输码只做绑定；第二三台直接输同一张码即可（同一个 user 的多个控制端／同一控制端控多屏）。
  // V2.1.43：绑定以**服务端返回**为准。配了 API 基点（`?api=https://…` 或 window.CDS_API）就走真接口：
  // POST /devices/register（本版无鉴权）→ POST /devices/bind {code}。**不得**把同源 localStorage /
  // BroadcastChannel 传的码当绑定依据——换设备、换浏览器、清缓存都会永远绑不上（Chief 22:10 指出的缺口）。
  // 未配置基点时保留同源 localStorage 顶替（**仅原型演示**），但已删掉那条「在同一浏览器开控制台」的报错：
  // 它本身就是在教人用假绑定。
  var API_BASE=(function(){ var m=/[?&]api=(https?:\/\/[^&]+)/.exec(location.search);
    return m?decodeURIComponent(m[1]):(window.CDS_API||''); })();
  function onBound(code, info){
    LS.setItem('cds.bound', '1');
    // api.md §4.2 硬约束：**控制码不得持久化**。码是长期有效口令，留在 localStorage 等于把口令贴在
    // 教室屏上——学生/清洁工开一次开发者工具就能读走，进而把自己的屏绑进老师账号、占满 4 台上限、
    // 看到投屏内容。屏端只留 `deviceToken`（装机凭据）与**码修订号**（随机串，不含码）。
    LS.removeItem('cds.code');                                  // 顺带清掉旧版本残留的码副本
    LS.setItem('cds.boundRev', LS.getItem('cds.codeRev')||'');
    LS.setItem('cds.boundAt', String(Date.now()));
    if(info && info.deviceId){ LS.setItem('cds.deviceId', info.deviceId); }
    // V2.1.54：删掉本地伪造凭据（原 `'cred-'+随机串` 写 `cds.credential`）——该键 1 写 2 删 0 读，
    // 是 api.md §4.2 ⑧「凭据只能来自注册响应」的旧模型残留。真机凭据只有 `deviceToken`（register 返回）。
    beat();
    entryErr('');
    $('banner').hidden=true;
    if(BC){ BC.postMessage({kind:'ackBound', text:'教室屏幕已接管', deviceId:deviceId()}); }
    S.scene='standby'; render();
    syncExitHot();            // 绑完立刻按内容态算热区：否则要等一次 resize 才长出来（自测抓到的第二处）
    sysOff();
  }
  function bindViaServer(code){
    var base=API_BASE.replace(/\/$/,''), tok=LS.getItem('cds.deviceToken')||'';
    // 凭据头必须**在注册之后**再取：首次使用 tok 为空，提前拼成 `Device ` 会被 Fetch 规范化成
    // 无值的 `Device`（尾空格被裁掉），服务端一律 401 ⇒ 首台屏永远绑不上，第二台却能绑（自测抓到的真缺陷）。
    function devAuth(){ return { 'Authorization':'Device '+(LS.getItem('cds.deviceToken')||''), 'Content-Type':'application/json' }; }
    var reg = tok ? Promise.resolve({ok:true, body:{deviceId:LS.getItem('cds.deviceId')||deviceId()}}) :
      fetch(base+'/devices/register', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ label:'教室屏幕 '+deviceId().slice(-2), ua:navigator.userAgent }) })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, status:r.status, body:j}; }); })
      .then(function(res){
        // 同上：deviceToken / deviceId 在 data 里（api.md §4.1 响应体），读到顶层会恒抛 no_token
        var b=res.body||{}, d=b.data||b;
        if(!res.ok || !d.deviceToken) throw {kind:'no_token', status:res.status, code:b.code};
        LS.setItem('cds.deviceToken', d.deviceToken);
        if(d.deviceId) LS.setItem('cds.deviceId', d.deviceId);
        return {ok:true, body:d};
      });
    reg.then(function(){
      return fetch(base+'/devices/bind', {method:'POST', headers:devAuth(), body:JSON.stringify({code:code})})
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, status:r.status, body:j}; }, function(){ return {ok:r.ok, status:r.status, body:{}}; }); });
    }).then(function(res){
      // api.md 全站响应包一层 {code,data}，错误码是**数字**（4091 已占用 / 4092 码无效 / 4094 限流 / 1001 凭据）。
      // 按 res.body.state 读是错的——它在 data 里面，会恒 undefined 并落到「无法完成绑定」那条兜底（自测抓到）。
      var b=res.body||{}, d=b.data||b, ec=(typeof b.code==='number')?b.code:null;
      if(res.ok && (d.state==='bound' || b.code===0)){ onBound(code, d); return; }
      if(ec===4094 || res.status===429){ entryErr('尝试过于频繁，请 1 分钟后再试'); return; }
      if(ec===4092 || res.status===400){ entryErr('控制码无效，请与控制台核对'); return; }
      if(ec===4091 || res.status===409){ entryErr('本屏已被其他账号绑定，请联系管理员处理'); return; }
      entryErr('无法完成绑定，请稍后重试（'+(ec||res.status||'—')+'）');
    }).catch(function(err){
      entryErr(err && err.kind==='no_token' ? '本机未能取得设备凭据，请重试或联系管理员' : '无法连接服务端，请检查网络后重试');
    });
  }
  function confirmCode(){
    var code=codeValue();
    if(code.length!==8){ entryErr('请输入 8 位控制码'); return; }
    if(API_BASE){ bindViaServer(code); return; }
    var expect = LS.getItem('cds.consoleCode');
    if(!expect || code !== expect){ entryErr('控制码无效，请与控制台核对'); return; }
    onBound(code);
  }
  $('go').addEventListener('click', confirmCode);

  // 输码页：只有中性提示。码不再过期，所以不谈有效期；失效只可能是「控制台更新了控制码」。
  (function(){
    var meta = $('codeMeta');
    if(meta) meta.textContent = '控制码长期有效 · 需要更换时由控制端更新，旧码随即失效';
  })();

  // 长按 3 秒清除本地码（输码态专用；内容态才是解绑）
  var pressT=null, raf=null, t0=0;
  function startPress(e){
    if(e.target.closest('input')||e.target.closest('button')) return;
    t0=performance.now(); $('ring').style.opacity='1';
    (function tick(){
      var p=Math.min(1,(performance.now()-t0)/3000);
      var c=$('ring').querySelector('circle');
      c.style.strokeDashoffset=String(100.5*(1-p));
      if(p>=1){ clearCode(); return; }
      raf=requestAnimationFrame(tick);
    })();
    pressT=setTimeout(clearCode, 3000);
  }
  function endPress(){ clearTimeout(pressT); cancelAnimationFrame(raf); $('ring').style.opacity='0'; $('ring').querySelector('circle').style.strokeDashoffset='100.5'; }
  $('entry').addEventListener('pointerdown', startPress);
  $('entry').addEventListener('pointerup', endPress);
  $('entry').addEventListener('pointercancel', endPress);
  $('entry').addEventListener('pointerleave', endPress);

  function clearCode(){
    endPress();
    LS.removeItem('cds.bound'); LS.removeItem('cds.credential'); LS.removeItem('cds.boundAt'); LS.removeItem('cds.displayBeat');
    $('content').hidden=true; $('entry').hidden=false;
    inputs.forEach(function(i){ i.value=''; });
    entryErr('已清除缓存的控制码');
    setTimeout(function(){ if(!codeValue()) entryErr(''); }, 3500);
    inputs[0].focus();
  }

  if(/[?&]reset=1/.test(location.search)) clearCode();

  // ── 控制台下行 ──
  function doRevoke(reason, text){
    // V2.1.43：确认框开着时收到 revoked ⇒ 直接关框回输码页，**不再发** release（设计要求 §3.4.1）
    if(typeof exitClose==='function') exitClose();
    // V2.1.23（CO-2026-11-18-04）：刷新控制码＝重置接管（reason=code_rotated）；全部解绑（reason=unbind）同走此路。
    // 已绑会话失效 → 清码回输码态；article/cast 不得停留（没人能翻页）→ 先落回 standby
    // V2.1.25：抽成函数，供「无 reason 的 codeChanged（旧页签）」走同一路径——两处实现分开写必然漂移
    S.scene='standby'; S.article.cast=false; S.cast.active=false; S.music.playing=false; S.music.anchor=null;
    LS.removeItem('cds.bound'); LS.removeItem('cds.credential'); LS.removeItem('cds.boundAt'); LS.removeItem('cds.displayBeat');
    // 文案按 reason 分：移出单台是「操作手段」不是「封禁」，措辞不得让老师以为被封了（Jeremyzh 定）
    // V2.1.47：三种 reason 必须对应三句可区分的文案（api.md §4.6；甲方定「移出接管是操作手段、不是封禁」）
    $('banner').textContent = text || (reason==='kicked' ? '已被移出接管，请重新输入控制码'
      : reason==='unbind' ? '本屏已解除接管，请重新输入控制码'
      : '控制码已更新，请重新输入');
    $('banner').hidden=false;
    $('content').hidden=true; $('entry').hidden=false; inputs.forEach(function(i){i.value='';});
    sysOff(); setTimeout(function(){ inputs[0].focus(); }, 120);
    if(typeof syncExitHot==='function') syncExitHot();
  }
  if(BC) BC.onmessage=function(ev){
    var d=ev.data||{};
    if(d.kind==='style'){ applyStyle(d.style); sys('样式已更新（不刷新页面）', false, 2200);
      // V2.1.5：字号是 px 且有量程变化，分页是「实测高度」——样式一变必须重排，否则旧页装不下新字号
      if(S.scene==='article') requestAnimationFrame(function(){ render(); });
      sendStyleApplied('');
      if(BC) BC.postMessage({kind:'ack', text:d.style ? '样式已应用' : ''}); return; }
    // CO-2026-11-18-05 / mqtt V2.2.23：device.bindState 是**状态快照**（d/{deviceId}/bind, retain），不是事件。
    // 快照与本地状态相同 ⇒ 幂等无操作；state='revoked' 才清码回输码页（reason 只决定文案）。
    if(d.kind==='device.bindState' && d.state==='bound'){ return; }   // 幂等：不闪界面、不重置场景、不重连
    if(d.kind==='device.bindState'){
      if(d.scope==='device' && d.deviceId && d.deviceId !== deviceId()) return;   // 不是我这台，忽略
      doRevoke(d.reason || (d.scope==='device' ? 'kicked' : 'code_rotated')); return;
    }
    if(d.kind==='revoke'){ doRevoke(d.reason||'unbind'); return; }
    if(d.kind==='codeChanged'){
      if(d.reason==='code_issued'){ sys('已为下一台屏幕出码（本屏不受影响）', false, 2000); return; }   // V2.1.23：自动续码，不动已绑会话
      // V2.1.25：无 reason 的 codeChanged＝旧控制台页签（V2.0.2–V2.1.22）按 ⟳ 刷新。
      // 旧口径「已连终端不受影响」已作废（CO-2026-11-18-04）；fail-safe 按 revoke 处理——
      // 否则本屏停在一张已被撤销的码上：新控制端控不了它、它也接不进新控制端＝孤儿屏。
      // 旧页签自己的 toast 仍是旧文案，属版本偏斜期的允许偏差，刷新页面即自愈。
      sys('检测到旧版控制台刷新了控制码：本屏已退出接管', true, 3000); doRevoke('legacy_no_reason'); return;
    }
    if(!LS.getItem('cds.bound')) return;
    if(d.kind==='standby'){ S.standby.mode=d.mode||'theme'; if(S.scene==='standby') render(); return; }
    if(d.kind==='article' && typeof d.cast==='boolean'){ S.article.cast=d.cast; }
    if(d.kind==='scene'){
      S.scene=d.scene;
      if(d.scene!=='music') S.music.playing=false;
      render(); return;
    }
    if(d.kind==='play'){
      S.music.idx=d.idx||0; S.music.pos=d.pos||0; S.music.playing=true; S.scene='music'; render();
      return;
    }
    if(d.kind==='music'){
      if(typeof d.idx==='number') S.music.idx=d.idx;
      if(typeof d.pos==='number') S.music.pos=d.pos;
      if(typeof d.playing==='boolean') S.music.playing=d.playing;
      S.music.anchor={ pos:S.music.pos, at:performance.now() };  // V2.2.11：单调时钟（Date.now 无 NTP 会跳，mqtt §4.1）
      if(S.scene==='music'){
        var bar=$('pbar'), it=S.music.items[S.music.idx]||{dur:245000};
        if(bar) bar.style.width=Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%';
        if(d.action==='toggle'||d.action==='prev'||d.action==='next'){ var sub=document.querySelector('.music .sub'); if(sub) sub.textContent=(S.music.playing?'正在播放':'已暂停')+' · 第 '+(S.music.idx+1)+' 首'; }
      } else if(d.playing){ S.scene='music'; render(); }
      return;
    }
    if(d.kind==='article'){
      var sameIdx=(S.scene==='article' && S.article.idx===(d.idx||0));
      S.article.idx=d.idx||0; S.article.page=d.page||0;
      if(d.unit) A.unit=(d.unit==='section'?'section':'page');
      if(typeof d.sectionIndex==='number') A.sectionIndex=d.sectionIndex;
      A.pageIndex=d.page||0;
      if(!sameIdx){ A.ready=false; A.sectionIndex=0; A.pageIndex=0; }
      if(typeof d.pageCount==='number') S.article.pageCount=d.pageCount;
      if(typeof d.cast==='boolean'){ S.article.cast=d.cast; if(!d.cast){ S.scene='standby'; render(); return; } }
      S.scene='article'; render(); return;
    }
    if(d.kind==='scroll'){
      if(d.unit) setUnit(d.unit);
      stepArticle(d.direction||'next', d.steps); return;
    }
    if(d.kind==='articleUnit'){ setUnit(d.unit); return; }
    if(d.kind==='fitOnePage'){ fitOnePage(); return; }
    if(d.kind==='cast'){
      S.cast.text=d.text||''; S.cast.active=!!d.active; if(d.castId) S.cast.castId=d.castId;
      S.scene = d.scene || (d.active?'cast':'standby'); render(); return;
    }
    if(d.kind==='volume'){ /* 原型不发声 */ return; }
  };

  // ── V2.1.43 屏端隐藏退出：右下角不可见热区，长按 3 秒 → 二次确认 → POST /devices/me/release ──
  // 不变量（设计 §3.4.1）：热区不可见；位移 >10px / 页面滚动（含板书滚动条轨道）/ 提前抬手 一律清零；
  // 吞 contextmenu 与 selectstart（平板长按会弹系统菜单）；released:false **不是失败**（回输码页、不报错）；
  // 确认框期间收到 revoked ⇒ 关框且不发请求。
  var hot=$('exit-hot'), dlg=$('exit-dlg'), exitT=null, exitX=0, exitY=0, exitArmed=false, dlgOpen=false;
  function exitCancel(){ if(exitT){ clearTimeout(exitT); exitT=null; } exitArmed=false; }
  function exitOpen(){ if(dlgOpen) return; dlgOpen=true; exitArmed=false; if(exitT){ clearTimeout(exitT); exitT=null; }
    dlg.hidden=false; var n=$('exit-no'); if(n) n.focus(); }   // 默认焦点在「取消」：连按 Enter 不得误确认
  function exitClose(){ if(!dlgOpen) return; dlgOpen=false; dlg.hidden=true; }
  function trackWidth(){
    // 滚动条轨道宽度＝滚动容器「占位宽－可视宽」（gutter:stable ⇒ 常驻）。
    // 只有轨道真的贴到视口右缘时才需要内缩：原型板书 max-width:74vw 居中时，轨道不在右下角。
    var p=document.querySelector('#content .cast .paper');
    if(!p) return 0;
    var w=p.offsetWidth-p.clientWidth;
    if(!(w>0)) return 0;
    return (window.innerWidth - p.getBoundingClientRect().right < 2) ? w : 0;
  }
  function syncExitHot(){
    // 只在内容态启用热区：输码态右下的 .reset-hint 是「清除本地码」，同一手势不能两义（§3.4.1）
    var on = !$('content').hidden && !!LS.getItem('cds.bound');
    hot.hidden = !on;
    var tw = (on && S.scene==='cast') ? trackWidth() : 0;
    hot.style.right = (tw ? tw + 2 : 0) + 'px';   // 内缩量＝实测轨道宽＋2px；无条件、不看是否溢出
    hot.setAttribute('data-track', String(tw));
    document.getElementById('content').classList.toggle('cast-on', on && S.scene==='cast');
  }
  hot.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  hot.addEventListener('selectstart', function(e){ e.preventDefault(); });
  hot.addEventListener('pointerdown', function(e){
    if(dlgOpen || hot.hidden) return;
    // 命中滚动条轨道 ⇒ 不计时（轨道与热区同像素；按坐标判，防平台滚动条比内缩量更宽）
    var tw = +(hot.getAttribute('data-track')||0);
    if(tw && e.clientX >= window.innerWidth - tw - 2){ exitCancel(); return; }
    e.preventDefault();
    exitX=e.clientX; exitY=e.clientY; exitArmed=true;
    exitT=setTimeout(function(){ exitT=null; if(exitArmed) exitOpen(); }, 3000);
  });
  hot.addEventListener('pointermove', function(e){
    if(!exitArmed) return;
    e.preventDefault();
    if(Math.abs(e.clientX-exitX)+Math.abs(e.clientY-exitY) > 10) exitCancel();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){ hot.addEventListener(t, function(){ exitCancel(); }); });
  window.addEventListener('scroll', function(){ exitCancel(); }, true);   // 滚讲义不该弹解绑框
  document.addEventListener('keydown', function(e){ if(dlgOpen && e.key==='Escape'){ e.preventDefault(); exitClose(); } });
  $('exit-no').addEventListener('click', exitClose);
  $('exit-yes').addEventListener('click', function(){
    if(!dlgOpen) return;                     // 已被 revoked 关掉 ⇒ 不发请求
    exitClose(); releaseSelf();
  });
  function exitToEntry(){
    LS.removeItem('cds.bound'); LS.removeItem('cds.boundAt'); LS.removeItem('cds.displayBeat');
    // V2.1.43：**不删** cds.deviceToken——release 按协议不撤 token（同一行可被重绑、不产生幽灵设备）。
    // 启动判定必须走 GET /devices/me 的 state（配置了 API 基点时），不得按「本地有 token」进内容页。
    // V2.1.55 补半句（防误读）：**单向模型**——本地 bound 标志表达「本屏已接管」的**意图**，REST 只能
    // **降级**（bound→revoked/unbound），不能**升级**（不得把屏拉回内容态）。若照上句把启动改成 REST
    // 驱动，清码立刻失效：清码后服务端仍 bound，下一轮就被拉回内容态。
    S.scene='standby'; S.article.cast=false; S.cast.active=false; S.music.playing=false;
    $('banner').textContent='本屏已解除接管，请重新输入控制码'; $('banner').hidden=false;
    $('content').hidden=true; $('entry').hidden=false;
    inputs.forEach(function(i){ i.value=''; }); entryErr('');
    syncExitHot();
    if(BC) BC.postMessage({kind:'ackUnbound', deviceId:deviceId()});
    setTimeout(function(){ inputs[0].focus(); }, 120);
  }
  function releaseSelf(){
    // released:true / released:false **都回输码页**：false ＝「现在本来就没绑定」，不是失败
    if(!API_BASE){ exitToEntry(); return; }
    var base=API_BASE.replace(/\/$/,''), tok=LS.getItem('cds.deviceToken')||'';
    fetch(base+'/devices/me/release', {method:'POST', headers:{'Authorization':'Device '+tok}})
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(){ exitToEntry(); })
      .catch(function(){ sys('无法连接服务端，已按解除接管处理', false, 3000); exitToEntry(); });
  }

  // ── V2.1.43 双击全屏（必须用户手势，首屏无法自动全屏）。全屏＝视口变化 ⇒ 重发 resize 触发重排 ──
  document.addEventListener('dblclick', function(e){
    if(e.target.closest('input')||e.target.closest('button')||e.target.closest('#exit-dlg')) return;
    var el=document.documentElement;
    if(document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    }else{
      (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    }
  });
  window.addEventListener('resize', function(){ syncExitHot(); });
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(t){
    document.addEventListener(t, function(){ window.dispatchEvent(new Event('resize')); });
    document.addEventListener(t, syncExitHot);
  });

  // ── 启动 ──
  LS.removeItem('cds.code');          // 旧版本残留的码副本：启动即清（api.md §4.2，码不得持久化）
  // 演示态（未配 ?api=）没有 deviceToken 概念：绑定只写 cds.bound，故闸只对真机生效，否则刷新即误踢。
  if(LS.getItem('cds.bound') && (LS.getItem('cds.deviceToken') || !API_BASE)){
    render(); beat();
    syncExitHot();
    checkBindingServer();                      // 启动即问一次：解绑/换码/被移出不该等到下一轮
  } else if(LS.getItem('cds.bound')){
    // V2.1.55 反向闸（启动侧）：bound=1 无 token ⇒ 不进内容态。否则会先渲染一帧、beat() 已把
    // 「假在线」写进 displayBeat，再被轮询踢回——中间那一秒在控制台就是一台假的在线屏。
    doRevoke('unbind','本机设备凭据已失效，请重新输入控制码');
    setTimeout(function(){ inputs[0].focus(); }, 200);
  } else {
    $('entry').hidden=false;
    setTimeout(function(){ inputs[0].focus(); }, 200);
  }

  // 轮询**无条件**开着（函数内部自己判 API_BASE / cds.bound）：只挂在「启动时已绑定」那一支上，
  // 会让「本次开机才绑上的屏」永远收不到撤销（自测抓到的第三处）。
  setInterval(checkBindingServer, 10000);

  // 演示深链：?scene=standby|music|article|cast｜?blank=1（黑屏）（仅原型，便于无需控制台单独看某一态）
  var mScene = /[?&]scene=(standby|music|article|cast)/.exec(location.search);
  if(mScene && LS.getItem('cds.bound')){ S.scene = mScene[1]; if(S.scene==='music' && /[?&]playing=1/.test(location.search)) S.music.playing=true;
    if(/[?&]blank=1/.test(location.search)){ S.scene='standby'; S.standby.mode='blank'; }
    render(); }

  if(DEBUG){ $('dbg').className='show'; $('dbg').textContent='debug · scene='+S.scene; }
})();
</script>
</body>
</html>
