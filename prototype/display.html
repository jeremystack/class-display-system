<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDS 显示端原型 V2.1（输码态 / 待机主题 / 内容态）</title>
<style>
:root{
  --cds-bg:#000; --cds-fg:#e8ecf2; --cds-fg-muted:#a9b3c2; --cds-accent:#8ab4f8;
  --cds-font-ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --cds-font-body:"Songti SC","Noto Serif SC",serif;
  --cds-font-scale:1.15; --cds-font-size:72px; --cds-line-height:1.75; --cds-align:left;
}
*{box-sizing:border-box}
html{font-size:18px}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--cds-bg);color:var(--cds-fg);font-family:var(--cds-font-ui)}
.stage{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:absolute;inset:0;transition:opacity .18s ease}
.view[hidden],#entry[hidden]{display:none}

/* ── 输码态 ── */
#entry{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vh 6vw}
.entry-inner{width:min(560px,86vw)}
.entry-inner h1{font-size:1.6rem;margin:0 0 .4rem;font-weight:600;letter-spacing:.05em}
.entry-inner p{color:var(--cds-fg-muted);margin:0 0 2.2rem;font-size:.9rem;line-height:1.7}
.digits{display:flex;gap:12px;justify-content:center;margin-bottom:1.4rem}
.digits input{width:min(72px,13vw);height:min(96px,18vw);text-align:center;font:600 min(2.6rem,7vw)/1 ui-monospace,monospace;
  color:var(--cds-fg);background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.18);border-radius:12px;outline:none}
.digits input:focus{border-color:var(--cds-accent);background:rgba(255,255,255,.09)}
.entry-inner button.go{font:600 1.05rem/1 var(--cds-font-ui);padding:1rem 3.2rem;border-radius:999px;border:none;
  background:var(--cds-accent);color:#06101f;cursor:pointer;min-height:52px}
.entry-inner button.go:active{transform:translateY(1px)}
.err{color:#ff9d9d;font-size:.85rem;min-height:1.4rem;margin-top:1rem}
.code-meta{font-size:.78rem;color:var(--cds-fg-muted);letter-spacing:.04em;margin:-1.2rem 0 1.4rem;min-height:1.2rem}
.code-meta.warn{color:#ffcf8a}
.code-meta.bad{color:#ff9d9d}
.entry-banner{position:absolute;top:0;left:0;right:0;padding:.85rem 1rem;background:#3a1414;color:#ffd7d7;font-size:.85rem;text-align:center}
.entry-banner[hidden]{display:none}
.reset-hint{position:absolute;right:18px;bottom:14px;font-size:12px;color:rgba(255,255,255,.28);user-select:none;cursor:default}
.ring{position:absolute;right:12px;bottom:8px;width:40px;height:40px;opacity:0;transition:opacity .1s}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke:rgba(255,255,255,.45);stroke-width:3;stroke-dasharray:100.5;stroke-dashoffset:100.5}

/* ── 内容态 ── */
#content{padding:5vh 5vw}
.music{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
/* V2.1.5：去掉音轨封面。Jeremyzh：显示端只留顶部歌名 + 歌词；音轨徽标属功能，留在控制台。 */
.music .t{font-size:1.5rem;font-weight:600;letter-spacing:.04em}
.music .sub{color:var(--cds-fg-muted);font-size:.8rem;margin-top:.5rem}
/* V2.1.5：歌词跟同一字号变量（--cds-font-size）走；字号可到 120px，当前行必须居中滚动，
   否则「当前句」会滚出 21vh 的可视区——那等于改了字号看不见歌词 */
.lyrics{margin-top:3vh;flex:1;min-height:0;overflow:hidden;width:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center}
.lyric{font-size:calc(var(--cds-font-size) * .78);line-height:1.5;color:rgba(255,255,255,.3);padding:.05em 0}
.lyric.cur{color:var(--cds-accent)}
.progress{position:absolute;left:5vw;right:5vw;bottom:4vh;height:4px;background:rgba(255,255,255,.14);border-radius:99px}
.progress i{display:block;height:100%;background:var(--cds-accent);border-radius:99px;transition:width .25s linear}

.article{height:100%;display:flex;flex-direction:column}
.article .foot{display:flex;justify-content:flex-end;font-size:.68rem;opacity:.5;min-height:1.4em}
.article .head{color:var(--cds-fg-muted);font-size:.8rem;letter-spacing:.06em;margin-bottom:2.5vh}
.article .head b{color:var(--cds-fg);font-size:1rem;margin-right:.8rem}
.body{flex:1;overflow:hidden;font-family:var(--cds-font-body);
  font-size:var(--cds-font-size);line-height:var(--cds-line-height);text-align:var(--cds-align)}
.body p{margin:0 0 1.1em;transition:font-size .2s ease,color .2s ease}
.body .sn{color:var(--cds-fg-muted);font-size:.6em;vertical-align:.25em;margin-right:.5em;font-family:var(--cds-font-ui)}

.cast{height:100%;display:flex;align-items:center;justify-content:center}
/* V2.1.5：板书独立 clamp——板书行数不可控，字号拉到 120px 会溢出（1.35rem×scale 是原来的坑） */
.cast .paper{max-width:74vw;max-height:100%;overflow:hidden;font-family:var(--cds-font-body);
  font-size:min(calc(var(--cds-font-size) * .9), 6.5vh);
  line-height:var(--cds-line-height);text-align:var(--cds-align);white-space:pre-wrap}

.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cds-fg-muted)}
.idle .room{font-size:1.35rem;color:var(--cds-fg);letter-spacing:.12em}
.idle .clock{font:300 4.2rem/1.2 ui-monospace,monospace;margin:2vh 0 1vh;color:rgba(255,255,255,.85)}
.idle .wait{font-size:.8rem;letter-spacing:.14em;color:rgba(255,255,255,.35)}

/* ── 系统层 ── */
#sys{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem;background:rgba(20,22,28,.92);
  border-top:1px solid rgba(255,255,255,.12);font-size:.8rem;color:#ffd9a0;display:none;z-index:50}
#sys.show{display:block}
#sys.bad{background:rgba(58,20,20,.94);color:#ffd7d7}
#dbg{position:fixed;right:10px;top:10px;font:11px/1.5 ui-monospace,monospace;color:rgba(255,255,255,.4);text-align:right;display:none}
#dbg.show{display:block}
</style>
</head>
<body>
<div class="stage">

  <!-- 输码态 -->
  <section class="view" id="entry">
    <div class="entry-banner" id="banner" hidden>控制码已失效，请重新输入</div>
    <div class="entry-inner">
      <h1>教室显示</h1>
      <p>请输入控制台上的控制码<br>（首次使用一次，之后开机自动连上）</p>
      <div class="code-meta" id="codeMeta"></div>
      <div class="digits" id="digits">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
        <input inputmode="numeric" maxlength="1" autocomplete="off">
      </div>
      <button class="go" id="go">确认</button>
      <div class="err" id="err"></div>
    </div>
    <span class="reset-hint" id="resetHint">长按 3 秒重置</span>
    <div class="ring" id="ring"><svg width="40" height="40"><circle cx="20" cy="20" r="16"/></svg></div>
  </section>

  <!-- 内容态（零控件） -->
  <section class="view" id="content" hidden></section>

  <div id="sys"></div>
  <div id="dbg"></div>
</div>

<script>
(function(){
  'use strict';
  var LS = window.localStorage, BC = ('BroadcastChannel' in window) ? new BroadcastChannel('cds-proto') : null;
  var $ = function(id){ return document.getElementById(id); };
  var DEBUG = /[?&]debug=1/.test(location.search);
  var sysTimer = null;                    // V2.1：显示端无音频（无音频上下文、无解锁状态）

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(ms){ var s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

  // ── 系统层 ──
  function sys(text, bad, ms){
    var el=$('sys'); el.textContent=text; el.className='show'+(bad?' bad':'');
    clearTimeout(sysTimer);
    if(ms) sysTimer=setTimeout(function(){ el.className=''; }, ms);
  }
  function sysOff(){ $('sys').className=''; }

  // ── 样式（本地缓存优先，避免闪字） ──
  function applyStyle(st){
    if(!st) return;
    var r=document.documentElement.style;
    if(st.fontFamily && st.fontFamily.body){
      var map={song:'"Songti SC","Noto Serif SC",serif',hei:'"PingFang SC","Microsoft YaHei",sans-serif',kai:'"Kaiti SC",KaiTi,serif','system-ui':'system-ui,sans-serif'};
      r.setProperty('--cds-font-body', map[st.fontFamily.body]||st.fontStack||'system-ui,sans-serif');
    }
    // V2.1.5：字号以 px 为准（24–120）。旧字段 fontScale 只作兼容：×18 折算 px。
    var fpx = st.fontSizePx ? +st.fontSizePx : (st.fontScale ? Math.round(st.fontScale * 18) : null);
    if(fpx) r.setProperty('--cds-font-size', Math.max(24, Math.min(120, fpx)) + 'px');
    if(st.fontScale) r.setProperty('--cds-font-scale', st.fontScale);
    if(st.lineHeight) r.setProperty('--cds-line-height', st.lineHeight);
    if(st.fg){ r.setProperty('--cds-fg', st.fg); }
    if(st.bg){ r.setProperty('--cds-bg', st.bg); }
    if(st.align) r.setProperty('--cds-align', st.align);
  }
  try{ applyStyle(JSON.parse(LS.getItem('cds.style')||'null')); }catch(e){}

  // ── 心跳（供控制台算"在线终端数"） ──
  function beat(){ if(LS.getItem('cds.bound')) LS.setItem('cds.displayBeat', String(Date.now())); }
  setInterval(beat, 1000);

  // ── 数据 ──
  var S = { scene:'standby', standby:{ mode:'theme' }, music:{ idx:0, playing:false, pos:0, anchor:null, items:[
      { t:'我心灵得安宁', m:'4:05', dur:245000 },{ t:'奇异恩典', m:'3:42', dur:222000 },{ t:'靠近主', m:'5:10', dur:310000 }]},
    article:{ idx:0, page:0, pageCount:0, cast:false, items:[{t:'诗篇 23 章',v:'诗篇',ch:23},{t:'约伯记 3 章',v:'约伯记',ch:3}]},
    cast:{ active:false, text:'', castId:'' }
  };
  try{
    var saved=JSON.parse(LS.getItem('cds.consoleState')||'null');
    if(saved){ S.music.items=saved.music; S.article.items=saved.article; }
  }catch(e){}

  var LYRICS = ['宇宙广阔无垠','我心灵得安宁','如海洋般深沉','主恩典够我用','我安然躺卧'];
  var VERSES = {
    23:[['1','耶和华是我的牧者，我必不致缺乏。'],['2','他使我躺卧在青草地上，领我在可安歇的水边。'],['3','他使我的灵魂苏醒，为自己的名引导我走义路。'],['4','我虽然行过死荫的幽谷，也不怕遭害，因为你与我同在。'],['5','在我敌人面前，你为我摆设筵席；你用油膏了我的头，使我的福杯满溢。'],['6','我一生一世必有恩惠慈爱随着我，我且要住在耶和华的殿中，直到永远。']],
    3:[['1','此后，约伯开口咒诅自己的生日。'],['2','说：愿我生的那日和说怀了男胎的那夜都灭没。'],['3','愿那日变为黑暗；愿神不从上面寻找它。']]
  };

  // ── 分页：渲染高度实测（V2.1 ⑦；页码只做展示，状态是 anchor） ──
  var pages=[], pagesKey='', measuring=false, pagesDirty=false;
  function measurePages(){
    var a=S.article.items[S.article.idx]||{ch:23};
    var vs=VERSES[a.ch]||VERSES[23];
    var body=document.querySelector('.article .body');
    if(!body) return;
    var H=body.clientHeight; if(H<40) return;
    var cs=getComputedStyle(body);
    var ruler=document.createElement('div');
    ruler.style.cssText='position:absolute;visibility:hidden;left:-9999px;top:0;width:'+body.clientWidth+
      'px;font-family:'+cs.fontFamily+';font-size:'+cs.fontSize+';line-height:'+cs.lineHeight;
    document.body.appendChild(ruler);
    var out=[], cur=[], h=0;
    vs.forEach(function(v){
      var p=document.createElement('p'); p.style.margin='0 0 .9em';
      p.innerHTML='<span class="sn">'+v[0]+'</span>'+esc(v[1]);
      ruler.appendChild(p);
      var ph=p.getBoundingClientRect().height;
      if(h+ph<=H){ cur.push(v); h+=ph; return; }
      if(cur.length){ out.push({verses:cur,cont:true}); cur=[]; h=0; }
      var text=v[1], lo=1, hi=text.length-1, cut=hi;
      while(lo<=hi){ var mid=(lo+hi)>>1;
        p.innerHTML='<span class="sn">'+v[0]+'</span>'+esc(text.slice(0,mid));
        if(p.getBoundingClientRect().height<=H){ cut=mid; lo=mid+1; } else { hi=mid-1; } }
      out.push({verses:[[v[0],text.slice(0,cut)]],cont:true});
      cur.push([v[0],text.slice(cut)]);            // 正文不插字符，跨页标记只在页脚
      p.innerHTML='<span class="sn">'+v[0]+'</span>'+esc(cur[0][1]);
      h=p.getBoundingClientRect().height;
    });
    if(cur.length) out.push({verses:cur,cont:false});
    ruler.remove();
    pages = out.length?out:[{verses:[],cont:false}];
    var k=S.article.idx+'/'+pages.length+'/'+S.article.page;
    if(k!==pagesKey){ pagesKey=k; pagesDirty=true; }
    if(S.article.page>=pages.length) S.article.page=pages.length-1;
  }

  // ── 内容渲染（无任何控件） ──
  function render(){
    if(!LS.getItem('cds.bound')) return;
    var c=$('content'), html='';
    // V2.1.5：同一 castId 的重发＝原地替换文本，不重建 DOM（学生看不到闪屏）
    if(S.scene==='cast' && S.cast.castId){
      var ex=document.querySelector('#content .cast .paper');
      if(ex && ex.getAttribute('data-cast-id')===String(S.cast.castId)){
        ex.textContent=S.cast.text||'（板书内容）'; requestAnimationFrame(fitCast); return;
      }
    }
    if(S.scene==='music'){
      var it=S.music.items[S.music.idx]||{t:'',m:'--:--',dur:245000};
      var cur=Math.min(LYRICS.length-1, Math.floor((S.music.pos/it.dur)*LYRICS.length));
      html='<div class="music">'+
        '<div class="t">'+esc(it.t)+'</div>'+
        '<div class="sub">'+(S.music.playing?'正在播放':'已暂停')+' · 第 '+(S.music.idx+1)+' 首</div>'+
        '<div class="lyrics" id="lrc">'+LYRICS.slice(Math.max(0,cur-1), cur+2).map(function(l,k){
            var i=Math.max(0,cur-1)+k;
            return '<div class="lyric'+(i===cur?' cur':'')+'">'+esc(l)+'</div>'; }).join('')+'</div>'+
        '</div>'+
        '<div class="progress"><i id="pbar" style="width:'+Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%"></i></div>';
    } else if(S.scene==='article'){
      var a=S.article.items[S.article.idx]||{t:'诗篇 23 章',v:'诗篇',ch:23};
      var pg=pages[S.article.page]||{verses:[]};
      html='<div class="article"><div class="head"><b>'+esc(a.t)+'</b><span>第 '+(S.article.page+1)+' / '+Math.max(1,pages.length)+' 屏</span></div>'+
        '<div class="body">'+(pg.verses||[]).map(function(v){return '<p><span class="sn">'+v[0]+'</span>'+esc(v[1])+'</p>';}).join('')+'</div>'+
        '<div class="foot">'+(pg.cont?'（续）':'')+'</div></div>';
    } else if(S.scene==='cast'){
      html='<div class="cast"><div class="paper" data-cast-id="'+(S.cast.castId||'')+'">'+esc(S.cast.text||'（板书内容）')+'</div></div>';
    } else if(S.scene==='standby'){
      if(S.standby.mode==='blank'){
        html='<div style="position:fixed;inset:0;background:#000"></div>';   // 纯黑：不让学生看到下一条内容
      } else {
        var now=new Date();
        html='<div class="idle"><div class="room">主堂 · 显示终端</div><div class="clock" id="dclock">'+
          String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+'</div>'+
          '<div class="wait">等待控制台</div></div>';
      }
    } else {
      html='';
    }
    c.innerHTML=html;
    requestAnimationFrame(fitCast);   // 等布局/字体生效后再量板书是否装得下
    $('content').hidden=false; $('entry').hidden=true;
    if(DEBUG) $('dbg').className='show';
    if(S.scene==='article' && !measuring){
      measuring=true;
      requestAnimationFrame(function(){
        pagesDirty=false; measurePages(); measuring=false;
        if(pagesDirty){ pagesDirty=false; render(); }
      });
    }
  }

  // V2.1.5：板书自动收缩——字号给足，装不下就逐档缩，直到整段装进一屏（大屏无人操作：不能滚动，也不能默默裁掉）
  function fitCast(){
    var wrap=document.querySelector('#content .cast'); if(!wrap) return;
    var p=wrap.querySelector('.paper'); if(!p) return;
    p.style.fontSize='';
    var base=parseFloat(getComputedStyle(p).fontSize)||48, cur=base, guard=0;
    while(p.scrollHeight > p.clientHeight+1 && p.clientHeight>0 && guard++<14){
      cur=Math.max(base*0.4, cur*0.92); p.style.fontSize=cur+'px';
      if(cur<=base*0.4+0.01) break;
    }
  }

  // ── 进度推进 ──
  setInterval(function(){
    if(S.scene!=='music'||!S.music.playing) return;
    if(S.music.anchor){                                   // V2.1：pos = anchor.pos + (now - anchor.at)
      S.music.pos = S.music.anchor.pos + (Date.now()-S.music.anchor.at);
    } else { S.music.pos+=250; }
    var it=S.music.items[S.music.idx]||{dur:245000};
    if(S.music.pos>=it.dur){ S.music.pos=0; }
    var bar=$('pbar'); if(bar) bar.style.width=Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%';
    var cur=Math.min(LYRICS.length-1, Math.floor((S.music.pos/it.dur)*LYRICS.length));
    if(cur!==S.music.lastCur){ S.music.lastCur=cur; render(); }   // 只渲染当前行 ±1，换句才重绘
    if(DEBUG) $('dbg').textContent='scene='+S.scene+' pos='+fmt(S.music.pos)+' styleV='+((JSON.parse(LS.getItem('cds.style')||'{}').styleVersion)||'-');
  },250);

  // ── 输码 ──
  var inputs=[].slice.call(document.querySelectorAll('#digits input'));
  function codeValue(){ return inputs.map(function(i){return i.value;}).join(''); }
  function entryErr(msg){ $('err').textContent=msg; }
  inputs.forEach(function(inp,i){
    inp.addEventListener('input', function(){
      inp.value=inp.value.replace(/\D/g,'').slice(0,1);
      if(inp.value && i<inputs.length-1) inputs[i+1].focus();
    });
    inp.addEventListener('keydown', function(e){
      if(e.key==='Backspace' && !inp.value && i>0){ inputs[i-1].focus(); inputs[i-1].value=''; e.preventDefault(); }
      if(e.key==='Enter') confirmCode();
    });
    inp.addEventListener('paste', function(e){
      var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
      if(t){ e.preventDefault(); t.split('').forEach(function(ch,k){ if(inputs[k]) inputs[k].value=ch; }); (inputs[Math.min(t.length,5)]||inputs[5]).focus(); }
    });
  });

  // V2.1：输码 = 仅绑定（音频锚点在控制页，显示端不碰音频）
  function confirmCode(){
    var code=codeValue();
    if(code.length!==6){ entryErr('请输入 6 位控制码'); return; }
    // V2.1：显示端无音频 → 输码只做绑定，不再解锁音频（原 §10.6 整节删除）

    var o = null;
    try{ o = JSON.parse(LS.getItem('cds.codeObj')||'null'); }catch(e){}
    if(o){
      if(o.used){ entryErr('该码已被使用，请在控制台点 ⟳ 获取新码'); return; }
      if(o.exp - Date.now() <= 0){ entryErr('控制码已过期，请在控制台刷新后重新输入'); return; }
      if(code !== o.code){ entryErr('控制码无效，请与控制台核对'); return; }
      o.used = true; LS.setItem('cds.codeObj', JSON.stringify(o));   // 单次消费
    } else {
      var expect = LS.getItem('cds.consoleCode');
      if(expect && code !== expect){ entryErr('控制码无效，请与控制台核对'); return; }
    }
    LS.setItem('cds.bound', '1');
    LS.setItem('cds.credential', 'cred-'+Math.random().toString(36).slice(2,10));
    LS.setItem('cds.boundAt', String(Date.now()));
    beat();
    entryErr('');
    $('banner').hidden=true;
    if(BC){ BC.postMessage({kind:'ackBound', text:'教室屏幕已绑定'}); }
    S.scene='standby'; render();
    sysOff();
  }
  $('go').addEventListener('click', confirmCode);

  // 输码页：只有中性提示（真机拿不到"剩余多久"，见变更单异议 4）
  // 结论（过期/已使用）一律在"确认"之后按服务端 reason 给文案，不在提交前预判
  (function(){
    var meta = $('codeMeta');
    if(meta) meta.textContent = '控制码 15 分钟内有效 · 过期请在控制台点 ⟳ 刷新';
  })();

  // 长按 3 秒重置
  var pressT=null, raf=null, t0=0;
  function startPress(e){
    if(e.target.closest('input')||e.target.closest('button')) return;
    t0=performance.now(); $('ring').style.opacity='1';
    (function tick(){
      var p=Math.min(1,(performance.now()-t0)/3000);
      var c=$('ring').querySelector('circle');
      c.style.strokeDashoffset=String(100.5*(1-p));
      if(p>=1){ clearCode(); return; }
      raf=requestAnimationFrame(tick);
    })();
    pressT=setTimeout(clearCode, 3000);
  }
  function endPress(){ clearTimeout(pressT); cancelAnimationFrame(raf); $('ring').style.opacity='0'; $('ring').querySelector('circle').style.strokeDashoffset='100.5'; }
  $('entry').addEventListener('pointerdown', startPress);
  $('entry').addEventListener('pointerup', endPress);
  $('entry').addEventListener('pointercancel', endPress);
  $('entry').addEventListener('pointerleave', endPress);

  function clearCode(){
    endPress();
    LS.removeItem('cds.bound'); LS.removeItem('cds.credential'); LS.removeItem('cds.boundAt'); LS.removeItem('cds.displayBeat');
    $('content').hidden=true; $('entry').hidden=false;
    inputs.forEach(function(i){ i.value=''; });
    entryErr('已清除缓存的控制码');
    setTimeout(function(){ if(!codeValue()) entryErr(''); }, 3500);
    inputs[0].focus();
  }

  if(/[?&]reset=1/.test(location.search)) clearCode();

  // ── 控制台下行 ──
  if(BC) BC.onmessage=function(ev){
    var d=ev.data||{};
    if(d.kind==='style'){ applyStyle(d.style); sys('样式已更新（不刷新页面）', false, 2200);
      if(BC) BC.postMessage({kind:'ack', text:d.style ? '样式已应用' : ''}); return; }
    if(d.kind==='revoke'){ LS.removeItem('cds.bound'); LS.removeItem('cds.credential'); LS.removeItem('cds.displayBeat'); $('banner').textContent='控制码已失效，请重新输入'; $('banner').hidden=false;
      $('content').hidden=true; $('entry').hidden=false; inputs.forEach(function(i){i.value='';}); return; }
    if(d.kind==='codeChanged'){ sys('控制码已刷新（已连终端不受影响）', false, 2500); return; }
    if(!LS.getItem('cds.bound')) return;
    if(d.kind==='standby'){ S.standby.mode=d.mode||'theme'; if(S.scene==='standby') render(); return; }
    if(d.kind==='article' && typeof d.cast==='boolean'){ S.article.cast=d.cast; }
    if(d.kind==='scene'){
      S.scene=d.scene;
      if(d.scene!=='music') S.music.playing=false;
      render(); return;
    }
    if(d.kind==='play'){
      S.music.idx=d.idx||0; S.music.pos=d.pos||0; S.music.playing=true; S.scene='music'; render();
      return;
    }
    if(d.kind==='music'){
      if(typeof d.idx==='number') S.music.idx=d.idx;
      if(typeof d.pos==='number') S.music.pos=d.pos;
      if(typeof d.playing==='boolean') S.music.playing=d.playing;
      S.music.anchor={ pos:S.music.pos, at:Date.now() };    // V2.1：本地按时基插值，不等逐条消息
      if(S.scene==='music'){
        var bar=$('pbar'), it=S.music.items[S.music.idx]||{dur:245000};
        if(bar) bar.style.width=Math.min(100,(S.music.pos/it.dur)*100).toFixed(1)+'%';
        if(d.action==='toggle'||d.action==='prev'||d.action==='next'){ var sub=document.querySelector('.music .sub'); if(sub) sub.textContent=(S.music.playing?'正在播放':'已暂停')+' · 第 '+(S.music.idx+1)+' 首'; }
      } else if(d.playing){ S.scene='music'; render(); }
      return;
    }
    if(d.kind==='article'){
      S.article.idx=d.idx||0; S.article.page=d.page||0;
      if(typeof d.pageCount==='number') S.article.pageCount=d.pageCount;
      if(typeof d.cast==='boolean'){ S.article.cast=d.cast; if(!d.cast){ S.scene='standby'; render(); return; } }
      S.scene='article'; render(); return;
    }
    if(d.kind==='cast'){
      S.cast.text=d.text||''; S.cast.active=!!d.active; if(d.castId) S.cast.castId=d.castId;
      S.scene = d.scene || (d.active?'cast':'standby'); render(); return;
    }
    if(d.kind==='volume'){ /* 原型不发声 */ return; }
  };

  // ── 启动 ──
  if(LS.getItem('cds.bound')){
    render(); beat();
  } else {
    $('entry').hidden=false;
    setTimeout(function(){ inputs[0].focus(); }, 200);
  }

  // 演示深链：?scene=standby|music|article|cast｜?blank=1（黑屏）（仅原型，便于无需控制台单独看某一态）
  var mScene = /[?&]scene=(standby|music|article|cast)/.exec(location.search);
  if(mScene && LS.getItem('cds.bound')){ S.scene = mScene[1]; if(S.scene==='music' && /[?&]playing=1/.test(location.search)) S.music.playing=true;
    if(/[?&]blank=1/.test(location.search)){ S.scene='standby'; S.standby.mode='blank'; }
    render(); }

  if(DEBUG){ $('dbg').className='show'; $('dbg').textContent='debug · scene='+S.scene; }
})();
</script>
</body>
</html>
