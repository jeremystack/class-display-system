<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDS 控制台原型 V2.1（一屏 · 四场景）</title>
<style>
:root{
  --surface:#0f1115; --raised:#171a21; --border:#262b36; --text:#e6e8ee; --muted:#9aa3b2;
  --brand:#2563eb; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--text);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px}
button:hover{border-color:#3a4252}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--brand);border-color:var(--brand)}
button.ghost{background:transparent}
input,select{font:inherit;color:inherit;background:#0b0d11;border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:34px}
h1,h2,h3{margin:0;font-weight:600}
.app{display:flex;flex-direction:column;height:100vh}

/* ── 顶栏 ── */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--border);background:#0c0e12}
.brand{font-weight:700;letter-spacing:.5px}
.brand small{color:var(--muted);font-weight:500;margin-left:6px}
.count{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:5px 12px;border:1px solid var(--border);border-radius:999px;color:var(--muted);cursor:default}
.count .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.count.zero .dot{background:var(--warn)}
.count.zero{color:#f0b060;border-color:#4a3718}
.code{display:flex;align-items:center;gap:10px;margin-left:auto;white-space:nowrap;padding:5px 12px;border:1px solid var(--border);border-radius:10px;background:#0b0d11}
.code .label{color:var(--muted);font-size:12px}
.code .meta{font-size:11px;color:var(--muted);padding:2px 7px;border:1px solid var(--border);border-radius:999px}
.code .meta.warn{color:#f0b060;border-color:#4a3718}
.code .meta.used{color:#8fb3ff;border-color:#243a63}
.code .meta.bad{color:#ff9d9d;border-color:#5a2222}
.code b{font:600 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px}
.code button{min-height:28px;padding:2px 8px}
.cfsize{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:4px 8px}
.cfsize button{min-height:22px;padding:0 7px;font-size:12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer}
.cfsize .ro{font-size:11px;opacity:.7}
.conn{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* ── 场景 Tab ── */
.tabs{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border)}
.tabs .seg{display:flex;gap:4px;padding:4px;background:#0b0d11;border:1px solid var(--border);border-radius:12px}
.tabs .seg button{border:none;background:transparent;min-height:36px;padding:7px 22px;border-radius:9px;color:var(--muted)}
.tabs .seg button[aria-selected="true"]{background:var(--brand);color:#fff}
.tabs .hint{margin-left:auto;color:var(--muted);font-size:12px}

/* ── 主体 ── */
.main{flex:1;display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:16px 20px;min-height:0;overflow:hidden}
@media (max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);overflow:auto}.lists{max-height:42vh}}
/* V2.1.9（P1）：控制端可以是手机。面积小 + 手指粗 → 44px 目标、单列、行距/字号常驻、发送靠按钮不靠手势 */
@media (pointer:coarse),(max-width:900px){
  button,.add,ol.items li{min-height:44px}
  .main{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:auto}
  .main .card.now{order:-1;overflow:visible}   /* V2.1.9：当前场景先出，别让老师滚过预选才够得着「发送」 */
  .lists{max-height:none}
  .castbox{height:auto}
  /* 发送条吸在视口底部：一行行写板书时按钮始终在拇指下，不用来回滚 */
  .castbar{position:sticky;bottom:0;z-index:6;margin-top:10px;padding:8px;border:1px solid var(--border);border-radius:12px;background:#0f131a;flex-wrap:nowrap}
  .castbar>span{display:none}          /* 手机上不塞长提示：按钮本身就是说明，省一行高度 */
  .castbar .ghost{padding:0 12px}
  nav.tabs{flex-wrap:wrap}
  .stage{min-height:50vh}
  #castText{min-height:30vh;font-size:17px;line-height:1.7}
  .castbar{gap:10px}
  .castbar .primary{flex:1 1 auto;min-height:52px;font-size:16px;margin-left:auto}
}
.readbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin:0 0 10px;border:1px solid var(--border);border-radius:10px;background:#0f131a}
.readbar label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.readbar input[type=range]{width:160px;height:24px}
.readbar .rv{color:var(--text);font-variant-numeric:tabular-nums;min-width:4.4em;display:inline-block}
.readbar .todo{font-size:12px;color:var(--muted)}
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;padding:14px;min-height:0;overflow:hidden}
.panel{display:flex;flex-direction:column;min-height:0}
.panel h3{font-size:13px;color:var(--muted);text-transform:none;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.panel h3 .tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 7px;font-weight:400}
.lists{overflow:auto;flex:1;margin:10px -6px 0;padding:0 6px}
.group{margin-bottom:14px}
.group .gh{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.items li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#12151c;cursor:pointer}
ol.items li:hover{border-color:#3a4252}
ol.items li.active{border-color:var(--brand);background:#14203a}
ol.items li .idx{width:18px;color:var(--muted);font:600 12px ui-monospace,monospace}
ol.items li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.items li .m{font-size:11px;color:var(--muted)}
ol.items li .mv{opacity:0;display:flex;gap:2px}
ol.items li:hover .mv{opacity:1}
ol.items li .mv button{min-height:22px;padding:0 5px;font-size:11px;background:transparent;border-color:var(--border)}
.add{width:100%;margin-top:2px;border-style:dashed;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:14px 4px}

/* ── 当前内容 ── */
.now{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
.now .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
/* V2.1.5：控制台也不再画封面（显示端已去掉，控制台留着会让人以为显示端还有） */
.musictitle{text-align:center;margin-top:14px;font-size:18px}
.musicsub{text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
.bar{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font:12px ui-monospace,monospace}
.track{flex:1;height:6px;border-radius:999px;background:#2a3140;position:relative;cursor:pointer}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--brand);border-radius:999px}
.track .knob{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;transform:translateX(-7px)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.ctrl button{min-width:42px}
.ctrl .play{min-width:58px;background:var(--brand);border-color:var(--brand)}
.extra{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;color:var(--muted);font-size:12px}
.extra input[type=range]{width:120px}
.article{max-width:760px;margin:0 auto;width:100%}
.article .head{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:12px;margin-bottom:10px}
.article .head b{color:var(--text);font-size:15px}
.verses{font-size:calc(17px * var(--console-font,1));line-height:1.9;color:#dde3ec}
.verses p{margin:0 0 8px}
.verses .sn{color:var(--muted);font-size:12px;margin-right:6px}
/* V2.1.5：板书满高——原来的 max-width:720px + min-height:180px 就是屏幕上下一大片空白的来源 */
.castbox{width:100%;max-width:none;margin:0;flex:1;display:flex;flex-direction:column;min-height:0;height:100%}
.stage-cast{align-items:stretch;min-height:0}
.casthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:8px}
.casthead b{color:var(--text);font-size:15px}
.casthead select{font-size:12px;padding:2px 6px;background:#0b0d11;color:var(--text);border:1px solid var(--border);border-radius:8px}
/* 不再用 min-height:70vh：768px 高的笔记本上会把「投出」按钮挤出屏幕。改为占满剩余高度（约 80%） */
.castbox textarea{width:100%;flex:1 1 auto;min-height:180px;resize:none;font:16px/1.8 system-ui;background:#0b0d11;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px}
.toast.undo{display:flex;gap:10px;align-items:center}
.toast.undo button{min-height:24px;padding:0 8px;font-size:12px;background:#2a3a5c;border-color:#3d5280;color:#dbe6ff}
.castbar{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.idle{text-align:center;color:var(--muted)}
.idle b{display:block;color:var(--text);font-size:17px;margin-bottom:8px}

/* ── 样式栏 ── */
.stylebar{border-top:1px solid var(--border);background:#0c0e12;padding:0 20px;flex:0 0 auto;max-height:38vh;overflow:auto}
.stylebar summary{cursor:pointer;padding:11px 0;font-size:13px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
.stylebar summary::-webkit-details-marker{display:none}
.stylebar summary:before{content:"▸";transition:transform .15s}
.stylebar[open] summary:before{transform:rotate(90deg)}
.srow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:0 0 14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input[type=color]{padding:0;width:44px;height:34px;background:none;border:1px solid var(--border)}
.field input[type=range]{width:130px}
.hintline{color:var(--muted);font-size:12px;margin-left:auto}

/* ── toast ── */
#toasts{position:fixed;left:50%;top:62px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:99}
.toast{background:#1c2331;border:1px solid #33405a;border-radius:10px;padding:9px 14px;font-size:13px;box-shadow:0 8px 24px #0008;animation:in .15s ease}
.toast.err{border-color:#7f2a2a;background:#2a1717}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ro{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">CDS<small>教室显示 · 控制台</small></div>
    <div class="count zero" id="count" title="只读指示，不可点击"><span class="dot"></span><span id="countText">当前 0 个终端在线</span></div>
    <div id="np" style="display:none;align-items:center;gap:8px;padding:4px 10px;border:1px solid #3a4356;border-radius:8px;font-size:12px;color:#cfd8e6"><span style="color:#8ab4f8">♪</span><span id="npTxt">—</span><button id="npResume" style="font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid #3a4356;background:transparent;color:#cfd8e6;cursor:pointer">继续</button><button id="npStop" style="font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid #3a4356;background:transparent;color:#cfd8e6;cursor:pointer">停止</button></div>
    <div class="code">
      <span class="label">控制码</span><b id="codeText">482 913</b><span class="meta" id="codeMeta">剩 15:00</span>
      <button id="refreshCode" title="刷新控制码（已连终端不掉线）">⟳</button>
      <button id="unbindAll" class="ghost" title="全部解绑：所有终端回到输码页" style="font-size:12px">全部解绑</button>
    </div>
    <a class="ghost" href="screen.html" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:12px" title="显控一体：这台电脑 + HDMI 复制到投影">🖥 单屏模式</a>
    <div class="cfsize" title="只改这台控制机的文字大小，不影响教室屏幕（V2.1.5）">
      <span>控制页</span>
      <button type="button" id="cfMinus">−</button>
      <span id="cfVal">100%</span>
      <button type="button" id="cfPlus">＋</button>
      <span class="ro">仅本机</span>
    </div>
    <div class="conn"><span class="dot"></span>已连接</div>
  </header>

  <nav class="tabs">
    <div class="seg" role="tablist">
      <button role="tab" data-scene="standby" aria-selected="false">待机</button>
      <button role="tab" data-scene="music" aria-selected="false">音乐</button>
      <button role="tab" data-scene="article" aria-selected="false">文章</button>
      <button role="tab" data-scene="cast" aria-selected="false">板书</button>
    </div>
    <span class="hint">四场景互斥 · 待机为默认 · 切换不刷新 · 切回状态保留 · 文章/板书期间不播放音乐 · 字号按 px · 行距可调 · 行数由显示端实测（V2.1.9）</span>
  </nav>

  <main class="main">
    <section class="card panel">
      <h3>今日预选 <span class="tag">有序 · 点条目即用</span></h3>
      <div class="lists">
        <div class="group">
          <div class="gh"><span>音乐</span><span id="mCount"></span></div>
          <ol class="items" id="musicList"></ol>
          <button class="add" data-add="music">＋ 添加曲目（此处才出现搜索）</button>
        </div>
        <div class="group">
          <div class="gh"><span>文章</span><span id="aCount"></span></div>
          <ol class="items" id="articleList"></ol>
          <button class="add" data-add="article">＋ 添加经文</button>
        </div>
      </div>
    </section>

    <section class="card now" id="now"></section>
  </main>

  <details class="stylebar" id="styleDetails">
    <summary>显示样式：<span id="styleSummary">宋体 · 1.15 · 行高 1.75</span>（下发即生效，不刷新）</summary>
    <div class="srow">
      <label class="field">正文字体
        <select id="sFont">
          <option value="song">宋体（经文）</option>
          <option value="hei">黑体</option>
          <option value="kai">楷体</option>
          <option value="system-ui">系统默认</option>
        </select>
      </label>
      <label class="field">显示端字号 <span id="sFontVal">72 px</span>
        <input type="range" id="sFontSize" min="24" max="160" step="4" value="72">
        <span class="hintline" id="sFontEst">—（等显示端回报）</span>
      </label>

      <label class="field">行高 <span id="sLhVal">1.75</span>
        <input type="range" id="sLh" min="1.2" max="2.2" step="0.05" value="1.75">
      </label>
      <label class="field">对齐
        <select id="sAlign"><option value="left">左对齐</option><option value="center">居中</option></select>
      </label>
      <label class="field">正文色<input type="color" id="sFg" value="#dddddd"></label>
      <label class="field">背景色<input type="color" id="sBg" value="#000000"></label>
      <button class="primary" id="pushStyle">下发样式</button>
      <span class="hintline" id="styleState">未下发</span>
    </div>
  </details>
</div>
<div id="toasts"></div>

<script>
(function(){
  'use strict';
  var LS = window.localStorage, BC = ('BroadcastChannel' in window) ? new BroadcastChannel('cds-proto') : null;
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(ms){ var s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function toast(msg, isErr){
    var box=$('toasts');
    var d=document.createElement('div'); d.className='toast'+(isErr?' err':''); d.textContent=msg;
    box.appendChild(d);
    while(box.children.length>3) box.firstChild.remove();
    setTimeout(function(){ d.remove(); }, 4000);
  }

  // ── 状态 ──
  var S = {
    codeObj: { code:'482913', exp: Date.now()+15*60*1000, used:false },
    scene: 'standby',
    standby: { mode:'theme' },
    termOnline: 0,
    music: { idx: 0, playing: false, pos: 0, items: [
      { t:'我心灵得安宁', m:'4:05', dur:245000, track:'main' },
      { t:'奇异恩典', m:'3:42', dur:222000, track:'accompaniment' },
      { t:'靠近主', m:'5:10', dur:310000, track:'main' }
    ]},
    art: { report: null },                                  // V2.1.6：显示端 pageMap 摘要回执
    article: { idx: 0, page: 0, unit: 'page', cast: false, items: [
      { t:'诗篇 23 章', v:'诗篇', ch:23 },
      { t:'约伯记 3 章', v:'约伯记', ch:3 }
    ]},
    cast: { text:'', draft:'', active:false, lines:5, castId:'' },   // text=已上屏内容，draft=编辑中草稿（V2.1.5 分离）
    // V2.1.11：字号/每行字数默认 auto（由显示端按屏高/屏宽派生），拖过滑块才锁定
    style: { fontFamily:{ui:'system-ui',body:'song'}, fontSizePx:'auto', lineHeight:1.75, charsPerLine:'auto', fg:'#dde3ec', bg:'#000000', align:'left' }
  };
  try{
    var saved = JSON.parse(LS.getItem('cds.consoleState')||'null');
    if(saved){ S.music.items = saved.music; S.article.items = saved.article; }
    var st = JSON.parse(LS.getItem('cds.style')||'null'); if(st) S.style = st;
    if(!S.style.fontSizePx) S.style.fontSizePx='auto';      // V2.1.11：缺省即 auto
    if(!S.style.charsPerLine) S.style.charsPerLine='auto';
    S.cast.draft = LS.getItem('cds.castDraft') || '';
    var cl = LS.getItem('cds.castLines'); if(cl) S.cast.lines = (cl==='all' ? 'all' : +cl);
    var cc = LS.getItem('cds.castId'); if(cc) S.cast.castId = cc;
    var co = JSON.parse(LS.getItem('cds.codeObj')||'null');
    if(co) S.codeObj = co;
    else { var c0 = LS.getItem('cds.consoleCode'); if(c0) S.codeObj = { code:c0, exp: Date.now()+15*60*1000, used:false }; }
  }catch(e){}
  function saveLists(){ LS.setItem('cds.consoleState', JSON.stringify({music:S.music.items, article:S.article.items})); }

  // V2.1.5：控制页字号（仅本机）——与 display.style.fontSizePx 完全独立，不进下发 payload
  S.cf = Math.max(0.6, Math.min(2, +(LS.getItem('consoleFontScale')||1)));
  function applyCF(){
    document.documentElement.style.setProperty('--console-font', S.cf);
    var el=$('cfVal'); if(el) el.textContent=Math.round(S.cf*100)+'%';
  }
  function bumpCF(d){
    S.cf = Math.max(0.6, Math.min(2, Math.round((S.cf+d)*100)/100));
    LS.setItem('consoleFontScale', S.cf);
    applyCF();
  }

  // ── V2.1.5 板书：双击发送「光标所在行及上方 N 行」 ──
  function castRange(text, caret, n){
    var lines=text.split('\n'), upto=0, li=0;
    for(; li<lines.length; li++){ upto += lines[li].length+1; if(caret<upto) break; }
    if(li>=lines.length) li=lines.length-1;
    var start = (n==='all') ? 0 : Math.max(0, li-n+1);
    var seg = lines.slice(start, li+1);
    while(seg.length && !seg[seg.length-1].trim()) seg.pop();   // 尾部空行 trim
    return { start:start, text:seg.join('\n') };
  }
  function toastUndo(msg, fn){
    var box=$('toasts');
    var d=document.createElement('div'); d.className='toast undo';
    var sp=document.createElement('span'); sp.textContent=msg; d.appendChild(sp);
    var b=document.createElement('button'); b.textContent='撤销';
    b.onclick=function(){ d.remove(); fn(); };
    d.appendChild(b); box.appendChild(d);
    while(box.children.length>3) box.firstChild.remove();
    setTimeout(function(){ if(d.parentNode) d.remove(); }, 3000);   // 3 秒撤销窗口
  }
  function sendCast(){
    var ta=$('castText'); if(!ta) return;
    S.cast.draft = ta.value;                       // 草稿保留，发送只取行范围
    var r=castRange(ta.value, ta.selectionStart, S.cast.lines||5);
    if(!r.text.trim()){ toast('光标这一行是空的，没有内容可发送', true); return; }
    if(S.music.playing){                       // 编排 pause-first（V2.1.2 不变量：看内容不得有声）
      S.music.playing=false;
      send({kind:'music', playing:false, pos:S.music.pos, idx:S.music.idx});
      renderNP();
    }
    var prev=S.cast.text, prevActive=S.cast.active;
    if(!S.cast.castId){ S.cast.castId='c'+Date.now().toString(36); LS.setItem('cds.castId', S.cast.castId); }
    S.cast.text=r.text; S.cast.active=true; S.scene='cast';
    send({kind:'cast', active:true, text:r.text, castId:S.cast.castId, scene:'cast'});
    render();
    var n=r.text.split('\n').length;
    toastUndo('已发送第 '+(r.start+1)+'–'+(r.start+n)+' 行', function(){
      S.cast.text=prev; S.cast.active=prevActive; if(!prevActive) S.scene='standby';
      send({kind:'cast', active:prevActive, text:prev, castId:S.cast.castId, scene:(prevActive?'cast':'standby')});
      render(); toast('已撤销发送');
    });
  }
  function bindCast(){
    var ta=$('castText');
    if(ta && !isCoarse()){
      ta.addEventListener('dblclick', function(e){
        e.preventDefault();
        // preventDefault 不会阻止双击选词，额外把选区收成光标，避免发送瞬间整词高亮
        try{ this.selectionStart=this.selectionEnd=this.selectionStart; }catch(err){}
        sendCast();
      });
    }
    var sel=$('castLines');
    if(sel){ sel.addEventListener('change', function(){
      S.cast.lines = (this.value==='all') ? 'all' : +this.value;
      LS.setItem('cds.castLines', String(S.cast.lines));
    }); }
  }

  function send(msg){ if(BC) BC.postMessage(msg); }
  var CODE_TTL = 15*60*1000;
  function shortClock(ms){
    var t = Math.max(0, Math.floor(ms/1000));
    return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  }
  function saveCode(){
    LS.setItem('cds.codeObj', JSON.stringify(S.codeObj));
    LS.setItem('cds.consoleCode', S.codeObj.code);
  }
  function setCode(c, used){
    S.codeObj = { code:c, exp: Date.now()+CODE_TTL, used: !!used };
    saveCode(); renderCode();
  }
  function renderCode(){
    var o = S.codeObj, meta = $('codeMeta'), left = o.exp - Date.now();
    $('codeText').textContent = o.code.slice(0,3)+' '+o.code.slice(3);
    if(!meta) return;
    if(o.used){ meta.textContent = '已使用 · 点⟳为下一台出码'; meta.className='meta used'; }
    else if(left <= 0){ meta.textContent = '已过期 · 点⟳刷新'; meta.className='meta bad'; }
    else { meta.textContent = '剩 '+shortClock(left); meta.className = 'meta'+(left < 120000 ? ' warn' : ''); }
  }
  setInterval(renderCode, 1000);

  // ── 终端在线（心跳） ──
  function beat(){
    var t = +(LS.getItem('cds.displayBeat')||0);
    var n = (Date.now()-t < 3000) ? 1 : 0;
    if(n !== S.termOnline){
      S.termOnline = n;
      var c = $('count');
      c.classList.toggle('zero', n===0);
      $('countText').textContent = n ? '当前 '+n+' 个终端在线' : '当前 0 个终端在线';
      if(n===1) toast('教室屏幕已连上');
      else toast('教室屏幕已断开', true);
      render();
    }
  }
  setInterval(beat, 1000);

  // ── 场景切换 ──
  // V2.1.2：进入「看内容」的画面（article / cast）必须先停音乐——编排 pause-first，
  // 不是场景指令的副作用（cast.start 本身不带 player.* 副作用）。
  function gotoScene(scene){
    if(scene === S.scene) return;
    if((scene === 'article' || scene === 'cast') && S.music.playing){
      S.music.playing = false;                                   // ① player.pause
      send({kind:'music', playing:false, pos:S.music.pos, idx:S.music.idx});
      renderNP();
      toast('音乐已暂停（' + (scene==='cast'?'板书':'文章') + '期间不播放音乐；结束不自动续播）');
      setTimeout(function(){ applyScene(scene); }, 160);          // ② 回执后切画面
      return;
    }
    applyScene(scene);
  }

  function applyScene(scene){
    S.scene = scene;
    if(scene === 'music' && S.music.playing === false && S.music.pos > 0) S.music.playing = true;
    send({kind:'scene', scene:scene});
    if(scene==='music') send({kind:'music', playing:S.music.playing, pos:S.music.pos, idx:S.music.idx});
    if(scene==='standby') send({kind:'standby', mode:S.standby.mode});
    if(scene==='article'){
      if(S.article.cast){ send({kind:'article', idx:S.article.idx, page:S.article.page, cast:true}); }
      else { render(); return; }   // 预览：只切本机面板，不上屏
    }
    if(scene==='cast') send({kind:'cast', active:S.cast.active, text:S.cast.text, scene:'cast'});
    render();
  }

  function measuredLines(){ var r=S.art&&S.art.report; return (r&&r.viewLines)?('首屏 '+r.viewLines+' 行'):'—（等显示端回报）'; }
  // V2.1.11：有效上限 = min(24 可读性底线, floor(1728÷字号))；24 不是技术限制（24px 下 floor 可达 72），
  // 是一行超过 24 个全角字后排跟行会跳字
  function cMax(fpx){ var f=+fpx; if(!f) f=72; return Math.max(6, Math.min(24, Math.floor(1728/Math.max(24,Math.min(160,f))))); }
  function cplOf(){ return (S.style.charsPerLine==='auto'||!S.style.charsPerLine) ? cMax(cNom()) : Math.min(cMax(cNom()), +S.style.charsPerLine); }
  function cplLabel(){ return (S.style.charsPerLine==='auto'||!S.style.charsPerLine) ? ('自动 '+cplOf()+' 字') : (cplOf()+' 字'); }
  function cNom(){ var v=S.style.fontSizePx; return (v==='auto'||!v) ? 72 : +v; }

  // V2.1.2：顶栏常驻音乐状态条。article/cast 下音乐必为 paused（继续置灰，服务端会 409）
  function renderNP(){
    var np=$('np'); if(!np) return;

    var on = S.scene !== 'music' && (S.music.playing || S.music.pos > 0);

    var it = S.music.items[S.music.idx] || {t:'—'};
    $('npTxt').textContent = '♪ ' + it.t + (muted ? '（已暂停）' : ' · 播放中') + ' · ' + fmt(S.music.pos) +
      ' · 画面在「' + ({standby:'待机',article:'文章',cast:'板书'}[S.scene]||S.scene) + '」';
    var rb = $('npResume');
    if(rb){
      rb.disabled = muted;
      rb.style.opacity = muted ? .4 : 1;
      rb.style.cursor = muted ? 'not-allowed' : 'pointer';
      rb.title = muted ? '文章/板书期间不播放音乐（服务端 409 audio_blocked_by_scene）' : '继续播放';

  function renderProgress(){
    var fill=$('fill'), knob=$('knob'), pos=$('posLabel');
    if(!fill) return;
    var d = (S.music.items[S.music.idx]||{dur:245000}).dur;
    var p = Math.min(1, S.music.pos/d);
    fill.style.width = (p*100)+'%'; knob.style.left = (p*100)+'%';
    if(pos) pos.textContent = fmt(S.music.pos);
  }

  var timer = setInterval(function(){
    if(S.music.playing){
      S.music.pos += 250;
      var d=(S.music.items[S.music.idx]||{dur:245000}).dur;
      if(S.music.pos >= d){
        if(S.music.idx < S.music.items.length-1){ S.music.pos=0; S.music.playing=false; toast('本曲结束：不自动续播，点下一首继续'); render(); }
        else { S.music.playing=false; S.music.pos=0; toast('已到清单末尾'); render(); }
      }
      renderProgress();
    }
  }, 250);

  // ── 事件 ──
  document.querySelector('.seg').addEventListener('click', function(e){

    gotoScene(b.dataset.scene);
  });

  document.querySelector('.lists').addEventListener('click', function(e){
    var mv=e.target.closest('button[data-up],button[data-down],button[data-del]');
    var li=e.target.closest('li[data-kind]');
    if(!li) return;
    var kind=li.dataset.kind, arr = kind==='music'?S.music.items:S.article.items, i=+li.dataset.i;
    if(mv){
      e.stopPropagation();
      if(mv.dataset.del!==undefined){ arr.splice(i,1); if(kind==='music'&&S.music.idx>=arr.length) S.music.idx=Math.max(0,arr.length-1); }
      else if(mv.dataset.up!==undefined && i>0){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; }
      else if(mv.dataset.down!==undefined && i<arr.length-1){ var t2=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t2; }
      saveLists(); render(); return;
    }
    // 点条目即用
    if(kind==='music'){
      // V2.1.5：点预选条目＝装载并落 paused（positionMs=0、曲目保留），点「播放」才出声。
      // 例外：正在播放时点「下一首」＝续播（否则连点两下会莫名静音）。
      var wasPlaying = S.music.playing;
      S.music.idx=i; S.music.pos=0; S.music.playing=wasPlaying; S.scene='music';
      send({kind:'scene',scene:'music'});
      send({kind:'music', playing:wasPlaying, pos:0, idx:i});
      toast(wasPlaying ? '已切到「'+arr[i].t+'」并续播' : '已装载「'+arr[i].t+'」· 点「播放」才出声');
    } else {
      S.article.idx=i; S.article.page=0; S.article.cast=false; S.scene='article';
      toast('已在预览：「'+arr[i].t+'」 · 点「开始投屏」才上屏');
    }
    render();
  });

  document.querySelectorAll('.add').forEach(function(b){
    b.addEventListener('click', function(){
      var kind=b.dataset.add;
      if(kind==='music'){
        var name = prompt('添加曲目（原型用输入代替搜索框）','新加的诗歌');
        if(name){ S.music.items.push({t:name,m:'--:--',dur:240000,track:'main'}); saveLists(); render(); toast('已加入预选末尾'); }
      } else {
        var name2 = prompt('添加经文（如：诗篇 23 章）','诗篇 23 章');
        if(name2) { S.article.items.push({t:name2,v:'诗篇',ch:23}); saveLists(); render(); toast('已加入预选末尾'); }
      }
    });
  });

  $('now').addEventListener('click', function(e){
    var m = e.target.closest('button[data-m]'), a = e.target.closest('button[data-a]');
    if(m){
      var k=m.dataset.m;
      if(k==='toggle'){ S.music.playing=!S.music.playing; if(S.music.playing) S.scene='music'; }
      if(k==='skip') S.music.pos=Math.max(0,S.music.pos-5000);
      if(k==='skip2') S.music.pos=Math.min(300000,S.music.pos+5000);
      if(k==='prev'){ S.music.idx=Math.max(0,S.music.idx-1); S.music.pos=0; S.music.playing=true; }
      if(k==='next'){ S.music.idx=Math.min(S.music.items.length-1,S.music.idx+1); S.music.pos=0; S.music.playing=true; }
      if(k==='track') toast('已切换音轨（原型示意）');
      send({kind:'music', playing:S.music.playing, pos:S.music.pos, idx:S.music.idx, action:k});
      render(); return;
    }
    if(a){
      var k2=a.dataset.a, uu=S.article.unit||'page';
      if(k2==='unit'){ S.article.unit = (uu==='section'?'page':'section'); send({kind:'articleUnit', unit:S.article.unit}); render(); return; }
      if(k2==='fit'){ send({kind:'fitOnePage'}); toast('已请求「整章一屏」：屏幕端按步长 4 降字号，实际值会回报'); return; }
      if(k2==='next' || k2==='prev'){
        send({kind:'scroll', direction:k2, unit:uu, steps:1});
        // 页码/节号等显示端回执（pageMap 摘要），控制台不自己算
        render(); return;
      }
      if(k2==='present'){
        S.article.cast = !S.article.cast;
        if(S.article.cast){ S.scene='article'; send({kind:'scene',scene:'article'}); send({kind:'article',idx:S.article.idx,page:S.article.page,unit:S.article.unit,cast:true}); toast('已投出到教室屏幕'); }
        else { S.scene='standby'; send({kind:'scene',scene:'standby'}); toast('已结束投屏：屏幕回待机'); }
        render(); return;
      }
      render(); return;
    }
    var sb=e.target.closest('button[data-sb]');
    if(sb){
      S.standby.mode = sb.dataset.sb;
      send({kind:'standby', mode:S.standby.mode});
      toast(S.standby.mode==='blank'?'已黑屏（内容不泄露；学生仍看得见操作）':'已切回主题大图');
      render(); return;
    }
    if(e.target.id==='castToggle'){
      S.cast.active = false; S.scene='standby';
      send({kind:'cast', active:false, text:S.cast.text, castId:S.cast.castId, scene:'standby'});
      toast('已结束板书（屏幕回待机）');
      render(); return;
    }
    if(e.target.id==='castSend'){ sendCast(); return; }
    if(e.target.id==='castPick') toast('图片 / PDF 上传走 R2 预签名（原型不实现）');
  });

  // 点进度条跳转
  document.addEventListener('click', function(e){
    if(e.target.closest('#track')){
      var r = e.target.closest('#track').getBoundingClientRect();
      var p = Math.min(1, Math.max(0, (e.clientX-r.left)/r.width));
      var d = (S.music.items[S.music.idx]||{dur:245000}).dur;
      S.music.pos = Math.round(p*d);
      send({kind:'music', playing:S.music.playing, pos:S.music.pos, idx:S.music.idx, action:'seek'});
      renderProgress();
    }
  });

  var inputTimer;
  $('now').addEventListener('input', function(e){
    if(e.target.id==='castText'){ S.cast.draft=e.target.value; clearTimeout(inputTimer); inputTimer=setTimeout(function(){ LS.setItem('cds.castDraft', S.cast.draft); },400); }   // V2.1.5：打字只存草稿，上屏只在「双击/发送」
    if(e.target.id==='vol'){ send({kind:'volume', value:+e.target.value}); }
  });

  // ── 控制码 ──
  // V2.1.2：继续——只在 standby 下可用；article/cast 下按钮禁用（服务端 409 audio_blocked_by_scene）
  $('npResume').addEventListener('click', function(){
    if(S.scene === 'article' || S.scene === 'cast'){
      toast('文章/板书期间不播放音乐：请先回到「待机」或「音乐」', true);
      return;
    }
    S.music.playing = true;
    send({kind:'music', playing:true, pos:S.music.pos, idx:S.music.idx});
    toast('继续播放（从 ' + fmt(S.music.pos) + ' 起）'); render();
  });

  // V2.1.1：顶栏常驻 now-playing 的「停止」——音乐是独立音轨，不需要先切回音乐画面
  $('npStop').addEventListener('click', function(){
    S.music.playing = false;
    send({kind:'music', playing:false, pos:S.music.pos, idx:S.music.idx, action:'stop'});
    toast('已停止播放（画面不动）'); render();
  });

  $('refreshCode').addEventListener('click', function(){
    var c = String(Math.floor(100000+Math.random()*900000));
    setCode(c);
    send({kind:'codeChanged', code:c});
    toast('已生成新控制码（15 分钟内有效，绑定一次即作废；已连终端不掉线）');
  });
  var unbindArmed = false, unbindTimer = null;
  $('unbindAll').addEventListener('click', function(){
    var b = this;
    if(!unbindArmed){
      unbindArmed = true; b.textContent = '再点一次确认';
      clearTimeout(unbindTimer);
      unbindTimer = setTimeout(function(){ unbindArmed=false; b.textContent='全部解绑'; }, 3000);
      return;
    }
    clearTimeout(unbindTimer); unbindArmed=false; b.textContent='全部解绑';
    send({kind:'revoke'});
    toast('已全部解绑：所有屏幕回到输码页', true);
  });

  // ── 样式下发 ──
  var map = { song:'"Songti SC","Noto Serif SC",serif', hei:'"PingFang SC","Microsoft YaHei",sans-serif', kai:'"Kaiti SC",KaiTi,serif', 'system-ui':'system-ui,sans-serif' };
  function readStyle(){
    var fpx = Math.max(24, Math.min(160, +$('sFontSize').value || 72));
    S.style = {
      fontFamily:{ ui:'system-ui', body:$('sFont').value },
      fontSizePx: (S.style.fontSizePx==='auto' ? 'auto' : fpx), lineHeight:+$('sLh').value,
      charsPerLine: (S.style.charsPerLine==='auto' ? 'auto' : Math.max(6, Math.min(cMax(fpx), +S.style.charsPerLine))),
      fg:$('sFg').value, bg:$('sBg').value, align:$('sAlign').value
    };
    $('sFontVal').textContent = fpx + ' px';
    $('sLhVal').textContent = S.style.lineHeight.toFixed(2);
    // V2.1.9：行数**只认 display 上报的 pageMap.viewLines**。
    // 这里曾用固定常数当可用高再除以 (fpx*行高)：那个常数≠.body.clientHeight(≈911)，且公式不含段距(0.63 行/节)，
    // 72px 给 7 行而真实 5 行；行距成了用户可调项后，任何本地公式都会立刻过期。
    var e=$('sFontEst'); if(e) e.textContent = measuredLines();
    var sm=$('styleSummary'); if(sm) sm.textContent=($('sFont').selectedOptions[0]||{}).textContent+' · '+(S.style.fontSizePx==='auto'?'字号自动':fpx+'px')+' · 行高 '+S.style.lineHeight.toFixed(2)+' · 每行 '+cplLabel();
    return S.style;
  }
  ['sFont','sFontSize','sLh','sAlign','sFg','sBg'].forEach(function(id){
    $(id).addEventListener('input', function(){ readStyle(); $('styleState').textContent='未下发（有改动）'; });
  });
  function publishStyle(noRender){
    var st = readStyle(); st.styleVersion = Date.now();
    st.fontStack = map[st.fontFamily.body] || 'system-ui,sans-serif';
    LS.setItem('cds.style', JSON.stringify(st));
    send({kind:'style', style:st});
    var ss=$('styleState'); if(ss) ss.textContent = '已下发 v'+String(st.styleVersion).slice(-4)+' · 等待回执';
    setTimeout(function(){ var e2=$('styleState'); if(e2) e2.textContent='已生效（显示端 '+S.termOnline+' 台）'; }, 600);
    if(!noRender) render();
  }
  $('pushStyle').addEventListener('click', function(){ publishStyle(false); });

  // V2.1.9：阅读场景常驻的字号/行距（与「显示样式」面板同一状态，改一次即下发）
  document.addEventListener('input', function(ev){
    var id = ev.target && ev.target.id;
    if(id !== 'rFontSize' && id !== 'rLh' && id !== 'rChars') return;
    if(id === 'rFontSize'){
      $('sFontSize').value = ev.target.value; S.style.fontSizePx = +ev.target.value; var f=$('rFontVal'); if(f) f.textContent = ev.target.value+'px';
      // V2.1.10：字号变大 → 每行字数上限自动降，并把当前值 clamp 到新上限（写明「上限」）
      var rc=$('rChars'), mx=cMax(+ev.target.value);
      if(rc){ rc.max=mx; if(+rc.value>mx){ rc.value=mx; S.style.charsPerLine=mx; } }
      var rcm=$('rCharsMax'); if(rcm) rcm.textContent='上限 '+mx+' 字';
      var rcv=$('rCharsVal'); if(rcv) rcv.textContent=cplLabel()+(+rc.value>=mx?'（上限）':'');
    }
    else if(id === 'rLh'){ $('sLh').value = ev.target.value; var l=$('rLhVal'); if(l) l.textContent = (+ev.target.value).toFixed(2); }
    else {
      var c=Math.max(6, Math.min(cMax($('sFontSize').value), +ev.target.value||6));
      S.style.charsPerLine=c; ev.target.value=c;
      var cv=$('rCharsVal'); if(cv) cv.textContent=c+' 字'+(c>=cMax($('sFontSize').value)?'（上限）':'');
    }
    // 拖滑块时不要整块 render（会重建 DOM、滑块失去焦点）
    publishStyle(true);
    var sp=$('styleDetails'); if(sp) sp.open = false;
  });

  // ── 显示端回执 ──
  if(BC) BC.onmessage = function(ev){
    var d = ev.data||{};
    if(d.kind==='ack') toast(d.text||'显示端已确认');
    if(d.kind==='ackBound'){
      S.codeObj.used = true; saveCode(); renderCode();
      toast('教室屏幕已绑定：本码已作废，接第二台请点 ⟳ 生成新码');
      beat();
    }
    // V2.1：显示端无音频，audioBlocked 已删除
    if(d.kind==='standby'){ S.standby.mode=d.mode||'theme'; if(S.scene==='standby') render(); }
    // V2.1.6：显示端 pageMap 摘要（6 标量）与板书实际字号
    if(d.kind==='pageMap'){
      S.art.report = d;
      var est=$('sFontEst'); if(est) est.textContent = measuredLines();
      var rln=$('rLines'); if(rln) rln.textContent = d.viewLines ? ('首屏 '+d.viewLines+' 行') : '—（等显示端回报）';
      if(typeof d.charsPerLine==='number') S.art.effCpl=d.charsPerLine;   // 显示端回报派生结果，不覆盖本机 auto 开关
      if(typeof d.unit==='string') S.article.unit=d.unit;
      if(typeof d.pageIndex==='number') S.article.page=d.pageIndex;
      if(typeof d.effectivePx==='number') toast('整章一屏：实际字号 '+d.effectivePx+'px（步长 4）');
      // V2.1.9：正在拖字号/行距滑块时不整块重绘（重建 DOM 会让滑块丢焦点、拖一下就断）
      var dragging = document.activeElement && document.activeElement.type==='range';
      if(S.scene==='article' && !dragging) render();
    }
    if(d.kind==='styleApplied'){
      var e=d.effective||{};
      // 显示端回报的是**派生结果**，不能覆盖本机的 auto 开关（否则下一次下发就把 auto 锁成数字）
      if(typeof e.charsPerLine==='number'){ S.art.effCpl=e.charsPerLine; var _rcv=$('rCharsVal'); if(_rcv && (S.style.charsPerLine==='auto'||!S.style.charsPerLine)) _rcv.textContent='自动 '+e.charsPerLine+' 字'; }
      if(d.note) toast(d.note);
    }
    if(d.kind==='castMetrics'){ S.cast.effPx=d.effectivePx; S.cast.setPx=d.settingPx; if(S.scene==='cast') render(); }
  };

  // ── 初始化 ──
  renderCode();
  $('sFont').value = (S.style.fontFamily && S.style.fontFamily.body) || 'song';
  // V2.1.5 存量迁移：旧 fontScale 量程（0.8–2.0 → 14–36px）在大屏上全部不可用，一律重置为 72px
  var fpx0 = cNom();
  $('sFontSize').value = Math.max(24, Math.min(160, fpx0)); $('sLh').value = S.style.lineHeight;
  applyCF();
  $('cfMinus').addEventListener('click', function(){ bumpCF(-0.1); });
  $('cfPlus').addEventListener('click', function(){ bumpCF(0.1); });
  $('sFg').value = S.style.fg === '#dde3ec' ? '#dddddd' : S.style.fg; $('sBg').value = S.style.bg;
  $('sAlign').value = S.style.align || 'left';
  readStyle();
  LS.setItem('cds.style', JSON.stringify(S.style));
  beat(); render();
})();
</script>
</body>
</html>
