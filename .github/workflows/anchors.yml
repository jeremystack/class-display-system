name: anchors

# 线上原型页锚点巡检：只读，不改仓库、不部署
on:
  push:
    branches: [main]
    paths: ['prototype/**']
  schedule:
    - cron: '0 11 * * *'   # 每日 19:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-vs-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare live pages with repo blobs
        run: bash scripts/ci/check-live-anchors.sh "$GITHUB_WORKSPACE" https://cds.242500.xyz/prototype
